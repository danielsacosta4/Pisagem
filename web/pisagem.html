<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pisagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Overpass:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Pisagem "Bilhete", map first. The map fills the screen; three tabs at the top (Gerar, Desenhar, O meu mapa);
   one floating card at a time on the left; the finished route rises from the bottom as a ticket.
   One language at a time (PT or EN). */
:root {
  --bg: #d9e3dc;
  --paper: #f6f7ef;         /* ticket stock */
  --chip: #e3ebe5;
  --ink: #12332a;
  --green: #0e5a43;         /* ticket print, the route */
  --green-dark: #09402f;
  --muted: #4c6b55;
  --line: #c9d6cc;
  --perf: #9fb8a8;          /* perforation */
  --field: #ffffff;
  --start: #f6efc9;
  --past: #a86a2c;          /* workouts you have already done */
  --route: var(--green);
  --casing: #ffffff;
  --moss: var(--green);
  --alt: #7d9187;
  --good: #1f7a4c;
  --warn: #a8640c;
  --bad: #b3261e;
  --official: #c98a00;
  --unlit: #3d44b8;
  --shadow: rgba(18,51,42,.18);
  --mix-main: #b3261e; --mix-road: #d98a1c; --mix-street: #a3aca6; --mix-path: #3f8f55;
  --mix-track: #8c6a3c; --mix-cycle: #2f78b5; --mix-foot: #6cb37d; --mix-steps: #7d5bbf; --mix-other: #c9d6cc;
  --dots: "Doto", "Courier New", monospace;
  --body: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --nav-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a16; --paper: #17241f; --chip: #22322b; --ink: #e3eee7; --green: #5cc79b; --green-dark: #3e9a74; --muted: #8fb3a0;
    --line: #2a3b33; --perf: #3c5248; --field: #1d2c26; --start: #f6efc9; --past: #e0a86a; --casing: #0f1a16; --alt: #7e948a;
    --good: #6cc48a; --warn: #e3a447; --bad: #ff7a70; --official: #f0b429; --unlit: #9aa2ff; --shadow: rgba(0,0,0,.45);
    --mix-main: #ff7a70; --mix-road: #f0a945; --mix-street: #6f7b74; --mix-path: #5fbf7f; --mix-track: #b8915c;
    --mix-cycle: #5aa3e0; --mix-foot: #8fd4a0; --mix-steps: #a98ae6; --mix-other: #2a3b33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a16; --paper: #17241f; --chip: #22322b; --ink: #e3eee7; --green: #5cc79b; --green-dark: #3e9a74; --muted: #8fb3a0;
  --line: #2a3b33; --perf: #3c5248; --field: #1d2c26; --start: #f6efc9; --past: #e0a86a; --casing: #0f1a16; --alt: #7e948a;
  --good: #6cc48a; --warn: #e3a447; --bad: #ff7a70; --official: #f0b429; --unlit: #9aa2ff; --shadow: rgba(0,0,0,.45);
  --mix-main: #ff7a70; --mix-road: #f0a945; --mix-street: #6f7b74; --mix-path: #5fbf7f; --mix-track: #b8915c;
  --mix-cycle: #5aa3e0; --mix-foot: #8fd4a0; --mix-steps: #a98ae6; --mix-other: #2a3b33;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
a { color: var(--green); }
#map { position: fixed; inset: 0; z-index: 0; background: var(--bg); }
.float { background: var(--paper); box-shadow: 0 6px 20px var(--shadow); }

/* ---- header ---- */
.top { position: fixed; z-index: 1000; top: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brandbox { display: flex; align-items: center; gap: 14px; border-radius: 14px; padding: 6px 6px 6px 16px; }
.wordmark { margin: 0; font: 800 22px/1 var(--body); letter-spacing: -0.02em; }
.tabs { display: flex; gap: 2px; background: var(--chip); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab svg { display: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current=page] { background: var(--green); color: var(--paper); }
.search { position: relative; flex: 1 1 260px; max-width: 440px; }
.search-field { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 14px; }
.search-field svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
.search-field input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; }
.search-field:focus-within { outline: 3px solid var(--green); outline-offset: 2px; }
.place-results { position: absolute; z-index: 1000; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 4px; list-style: none; background: var(--paper); border-radius: 12px; box-shadow: 0 10px 30px var(--shadow); max-height: 300px; overflow-y: auto; }
.place-results li { padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; }
.place-results li small { color: var(--muted); font-size: 12px; }
.place-results li[aria-selected=true], .place-results li:hover { background: var(--chip); }
.plan-pill { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 8px 0 14px; border-radius: 14px; border: 0; cursor: pointer; font-weight: 600; min-width: 0; max-width: 520px; }
.plan-pill #plan-sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.plan-pill .pp-btn { padding: 7px 12px; border-radius: 10px; background: var(--chip); font-size: 13px; flex-shrink: 0; }
.tools { margin-left: auto; display: flex; gap: 8px; position: relative; }
.tool { height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; flex-shrink: 0; }
.tool .off { color: var(--muted); font-weight: 400; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: 300px; max-width: calc(100vw - 32px); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }

/* ---- floating cards ---- */
.panel { position: fixed; z-index: 900; left: 16px; background: var(--paper); border-radius: 18px; box-shadow: 0 12px 34px var(--shadow); }
#plan, #draw-card { top: 92px; width: 350px; max-width: calc(100% - 32px); max-height: calc(100% - 108px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
#more { top: 92px; bottom: 16px; width: 400px; max-width: calc(100% - 32px); display: flex; flex-direction: column; }
#mymap-panel { bottom: 16px; width: 390px; max-width: calc(100% - 32px); max-height: calc(100% - 108px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
#result { bottom: 16px; width: 580px; max-width: calc(100% - 32px); max-height: calc(100% - 108px); background: transparent; box-shadow: none; border-radius: 0; display: flex; flex-direction: column; gap: 8px; }
body[data-view=draw] #result { max-height: max(280px, calc(100% - 400px)); }

.k { font-size: 12px; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.gh { font-weight: 800; }
.btn { border: 2px solid var(--green); background: transparent; border-radius: 12px; padding: 0 14px; cursor: pointer; font-weight: 600; font-size: 14px; min-height: 44px; }
.btn:hover { background: var(--chip); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.primary { border: 0; border-radius: 14px; padding: 16px; background: var(--green); color: var(--paper); font: 800 18px/1.1 var(--body); box-shadow: 0 4px 0 var(--green-dark); }
.btn.primary:hover { filter: brightness(1.07); background: var(--green); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
.link { border: 0; background: transparent; color: var(--green); font-weight: 600; font-size: 13px; cursor: pointer; padding: 8px 0; }
.link.danger { color: var(--bad); }
.round { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--field); font: 800 18px/1 var(--body); cursor: pointer; display: grid; place-items: center; padding: 0; }
.round svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* plan card */
.start { display: flex; align-items: center; gap: 10px; }
.start-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--start); border: 4px solid var(--green); flex-shrink: 0; }
.start-text { flex: 1; min-width: 0; }
#start-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#start-name.empty { color: var(--muted); font-weight: 400; white-space: normal; }
.acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.acts input, .terrain input, .seg input, .chips input { position: absolute; opacity: 0; pointer-events: none; }
.acts label { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--line); background: var(--field); border-radius: 12px; padding: 10px 2px; font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; text-align: center; line-height: 1.15; }
.acts svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.acts input:checked + label { background: var(--green); border-color: var(--green); color: var(--paper); }
.acts input:focus-visible + label, .terrain input:focus-visible + label, .seg input:focus-visible + label, .chips input:focus-visible + label { outline: 3px solid var(--ink); outline-offset: 2px; }
.dist { display: flex; flex-direction: column; gap: 8px; }
.dist-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dist-row label { font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; }
#dist-out { font: 900 34px/1 var(--dots); color: var(--green); min-width: 96px; text-align: center; }
#dist-out small { font-size: 20px; }
input[type=range] { width: 100%; accent-color: var(--green); margin: 0; }
.more-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; padding: 12px 0; cursor: pointer; }
.more-row > span { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.more-row b { font-weight: 600; }
.more-row svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.today { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; padding: 9px 12px; border-radius: 12px; background: var(--chip); }
.today.alert { background: color-mix(in srgb, var(--bad) 14%, var(--paper)); border: 1px solid var(--bad); }
.today span { flex: 1 1 180px; }
.today .btn { min-height: 34px; padding: 0 12px; font-size: 13px; }
.tag { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--chip); }

/* more options */
.more-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.more-head b { font: 800 19px/1 var(--body); }
.more-head .link { margin-left: auto; }
.more-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 22px; }
.more-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; }
.more-foot .btn { flex: 1; }
.group { display: flex; flex-direction: column; gap: 8px; }
.terrain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.terrain label { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--line); background: var(--field); border-radius: 12px; padding: 10px 4px; font-weight: 600; font-size: 14px; cursor: pointer; user-select: none; text-align: center; }
.terrain svg { width: 40px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.terrain input:checked + label { background: var(--green); border-color: var(--green); color: var(--paper); }
.sw-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--chip); cursor: pointer; }
.sw-row:last-child { border-bottom: 0; }
.sw-row > span { flex: 1; display: flex; flex-direction: column; }
.sw-row b { font-weight: 600; }
.sw-row small { font-size: 13px; color: var(--muted); }
.switch { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex-shrink: 0; cursor: pointer; margin: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--field); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(18px); background: var(--paper); }

/* segmented control and chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--chip); border-radius: 10px; padding: 3px; }
.seg label { text-align: center; border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
.seg input:checked + label { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips label { border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--chip); user-select: none; }
.chips input:checked + label { background: var(--green); color: var(--paper); }

/* draw card */
.draw-hint { margin: 0; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.draw-hint b { font: 900 15px/1 var(--dots); background: var(--start); color: #12332a; border-radius: 6px; padding: 4px 6px; flex-shrink: 0; }
.draw-row { display: flex; flex-wrap: wrap; gap: 8px; }
.draw-row .seg { flex: 1 1 100%; }
.draw-row .btn { flex: 1; }

/* ---- the ticket ---- */
.opt-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.opt { flex: 1 0 auto; min-width: 108px; border: 0; border-radius: 12px 12px 4px 4px; padding: 9px 12px; background: color-mix(in srgb, var(--paper) 82%, transparent); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px; box-shadow: 0 4px 14px var(--shadow); }
.opt[aria-selected=true] { background: var(--paper); box-shadow: 0 -3px 0 var(--green) inset, 0 4px 14px var(--shadow); }
.opt-name { display: flex; align-items: center; gap: 6px; font-weight: 800; white-space: nowrap; }
.opt-stats { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); }
.ticket { display: flex; background: var(--paper); border-radius: 16px; box-shadow: 0 14px 40px var(--shadow); min-height: 0; flex: 0 1 auto; }
.t-main { flex: 1; min-width: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; border-right: 2px dashed var(--perf); overflow-y: auto; }
.t-main > * { flex-shrink: 0; }
.t-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.t-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.t-dist { font: 900 56px/1 var(--dots); color: var(--green); white-space: nowrap; }
.t-dist small { font-size: 26px; }
.t-mini { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0; }
.t-mini dt, .stats dt { font-size: 12px; color: var(--muted); }
.t-mini dd { margin: 2px 0 0; font: 900 22px/1 var(--dots); white-space: nowrap; }
.t-mini dd small, .stats dd small { font-size: 14px; margin-left: 1px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; margin: 10px 0 0; }
.stats dd { margin: 2px 0 0; font: 900 20px/1 var(--dots); white-space: nowrap; }
.t-issues { margin: 0; font-size: 13px; color: var(--warn); }
.t-more summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--green); }
.t-more .hint { margin-top: 8px; }
#chart { width: 100%; height: 72px; display: block; touch-action: pan-y; cursor: crosshair; }
#chart.with-hr { height: 140px; }
.color-by { display: flex; flex-direction: column; gap: 6px; }
.color-by .seg label { padding: 6px 8px; font-size: 13px; }
.ramp-legend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ramp-legend i { display: inline-block; width: 14px; height: 6px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.chart-read { margin: -6px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
#chart text { fill: var(--muted); font: 11px var(--body); font-variant-numeric: tabular-nums; }
.mix { display: grid; gap: 5px; }
.mix-bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--line); }
.mix-bar span { display: block; height: 100%; }
.mix-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mix-legend b { font-weight: 600; color: var(--ink); }
.mix-bar span + span { box-shadow: -2px 0 0 var(--paper); }
.mix-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.t-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.t-actions .btn.primary { flex: 1 1 160px; padding: 13px; font-size: 16px; box-shadow: 0 3px 0 var(--green-dark); }
.stub { width: 74px; padding: 18px 10px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 12px; flex-shrink: 0; }
.t-no { writing-mode: vertical-rl; transform: rotate(180deg); font: 900 19px/1 var(--dots); color: var(--green); white-space: nowrap; }
.barcode { width: 38px; height: 38px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px); }
.sheet-handle { display: none; }
.notice { font-size: 13px; padding: 9px 12px; border-radius: 10px; background: var(--paper); border: 1px dashed var(--perf); box-shadow: 0 4px 14px var(--shadow); }
.notice.warn { border-color: var(--warn); }
#notice { display: flex; flex-direction: column; gap: 6px; }
#notice:empty { display: none; }
.share-box { display: flex; gap: 6px; margin-top: 6px; }
.share-box input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; background: var(--field); }

/* my map */
.mm-big { font: 900 54px/1 var(--dots); color: var(--past); }
.mm-big small { font-size: 24px; }
.mm-big.empty { color: var(--perf); }
.mm-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#mm-months { width: 100%; height: 96px; display: block; touch-action: pan-y; }
#mm-months-read { margin-top: 2px; }
#mm-months text { fill: var(--muted); font: 10px var(--body); }
.mm-block summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.zone-bar { display: flex; gap: 2px; height: 10px; margin: 10px 0 8px; }
.zone-bar span { display: block; height: 100%; border-radius: 3px; min-width: 2px; }
.zone-rows { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.zone-rows i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.zone-rows .t { text-align: right; font-weight: 600; }
.rec-sport { font-weight: 800; font-size: 13px; margin: 10px 0 4px; }
.rec-list { display: flex; flex-direction: column; gap: 4px; }
.rec { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 1px dashed var(--perf); background: var(--paper); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.rec span { color: var(--muted); }
.rec b { font-weight: 700; white-space: nowrap; }
.help summary, #wk-box summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.help p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
#wk-count { color: var(--muted); font-weight: 400; }
.wk-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.wk-list:empty { display: none; }
.wk-item { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 1px dashed var(--perf); background: var(--paper); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 13px; }
.wk-item b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.wk-item span { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* status toast */
.toast { position: fixed; z-index: 1100; top: 84px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(520px, calc(100vw - 32px)); background: var(--ink); color: var(--paper); border-radius: 14px; padding: 10px 16px; font-size: 14px; box-shadow: 0 8px 24px var(--shadow); cursor: pointer; }
.toast.error { background: var(--paper); color: var(--ink); border: 2px solid var(--bad); }

/* settings, layers */
.key-row { display: flex; gap: 8px; }
.key-row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.layers-panel { width: 290px; }
.layers-bases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.layers-bases input { position: absolute; opacity: 0; pointer-events: none; }
.layers-bases label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-weight: 600; cursor: pointer; border: 2px solid transparent; border-radius: 8px; padding: 4px; line-height: 1.2; }
.layers-bases .sw { display: block; height: 38px; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 3px; }
.layers-bases input:checked + label { border-color: var(--green); }
.layers-bases input:focus-visible + label { outline: 3px solid var(--ink); }
.layers-ov { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 3px 0; }
.layers-ov input { accent-color: var(--green); width: 16px; height: 16px; margin: 0; }

/* map furniture */
.leaflet-container { font: 13px var(--body); }
.leaflet-bar a, .leaflet-control-attribution, .leaflet-control-scale-line, .leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-tooltip {
  background: var(--paper) !important; color: var(--ink) !important; border-color: var(--line) !important;
}
.leaflet-control-attribution a, .leaflet-popup-content a { color: var(--green); }
#map.dim-tiles .leaflet-tile-pane { filter: brightness(.7) contrast(1.1) saturate(.8); }
.wp-icon { background: var(--paper); border: 2px solid var(--green); border-radius: 6px; width: 24px !important; height: 24px !important; display: grid; place-items: center; font: 900 14px/1 var(--dots); color: var(--green); }
.wp-icon.edit { cursor: grab; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.start-icon { background: var(--start); border: 4px solid var(--green); border-radius: 50%; }
.ghost-icon { background: var(--green); border: 2px solid var(--paper); border-radius: 50%; }
.route-hit { cursor: copy; }
.stop-icon { background: var(--paper); border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 13px; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.stops { display: flex; flex-wrap: wrap; gap: 6px; }
.stop-chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--chip); }

/* ---- phones: tabs become a bottom bar, cards become bottom sheets ---- */
@media (max-width: 720px) {
  :root { --nav-h: calc(62px + env(safe-area-inset-bottom, 0px)); }
  .top { top: 10px; left: 10px; right: 10px; gap: 8px; flex-wrap: nowrap; }
  .brandbox { padding: 0; background: transparent; box-shadow: none; }
  .wordmark { display: none; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav-h); padding: 0 0 env(safe-area-inset-bottom, 0px); border-radius: 0; background: var(--paper); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; z-index: 1001; }
  .tab { flex-direction: column; justify-content: center; gap: 3px; font-size: 12px; border-radius: 0; color: var(--muted); padding: 6px 0; }
  .tab[aria-current=page] { background: transparent; color: var(--green); font-weight: 800; }
  .tab svg { display: block; }
  .search { flex: 1 1 auto; max-width: none; min-width: 0; }
  .search-field, .plan-pill { height: 48px; }
  .plan-pill { flex: 1 1 auto; max-width: none; }
  .tools { gap: 6px; }
  .tool { padding: 0; width: 44px; }
  .tool .lbl, .tool .off { display: none; }
  .toast { top: auto; bottom: calc(var(--nav-h) + 12px); }
  .panel { left: 0 !important; right: 0; width: auto !important; max-width: none !important; top: auto !important; bottom: var(--nav-h) !important; border-radius: 20px 20px 0 0; max-height: 64vh !important; overflow-y: auto; box-shadow: 0 -10px 30px var(--shadow); }
  #plan { padding: 14px 16px 16px; gap: 12px; }
  #more { height: 72vh; }
  #draw-card { top: 66px !important; bottom: auto !important; left: 10px !important; right: 10px; border-radius: 14px; padding: 10px; gap: 8px; max-height: none !important; }
  #draw-card .draw-hint { font-size: 13px; padding: 8px 10px; }
  #draw-card .acts label { flex-direction: row; justify-content: center; padding: 6px 2px; font-size: 12px; }
  #draw-card .acts svg { width: 18px; height: 18px; }
  #draw-card .draw-row { flex-wrap: nowrap; }
  #draw-card .draw-row .seg { flex: 1 1 auto; }
  #draw-card .draw-row .btn { flex: 0 0 auto; padding: 0 10px; }
  #result { background: var(--paper); padding: 6px 12px 12px; gap: 6px; overflow-y: auto; }
  body[data-view=draw] #result { max-height: 46vh !important; }
  #result .ticket { box-shadow: none; border-radius: 0; flex-shrink: 0; }
  .stub { display: none; }
  .t-main { border-right: 0; padding: 4px 2px; overflow: visible; }
  .t-dist { font-size: 46px; }
  .opt { box-shadow: none; background: var(--chip); border-radius: 10px; min-width: 96px; }
  .opt[aria-selected=true] { background: var(--paper); box-shadow: 0 0 0 2px var(--green) inset; }
  .sheet-handle { display: block; align-self: center; width: 60px; height: 22px; border: 0; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; }
  .sheet-handle::after { content: ""; position: absolute; left: 10px; right: 10px; top: 8px; height: 5px; border-radius: 3px; background: var(--line); }
  body.sheet-min #chart, body.sheet-min .mix, body.sheet-min .t-more, body.sheet-min #edit-hint, body.sheet-min .t-issues, body.sheet-min #notice { display: none !important; }
  .leaflet-bottom { bottom: var(--nav-h); }
  .leaflet-control-zoom { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
