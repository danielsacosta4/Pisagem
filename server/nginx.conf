# One address for everything: the page, routes, map data and search.
# Services are looked up per request (Docker's DNS), so the page still starts
# while a service is building or restarting.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript;

    location / {
        root /usr/share/nginx/html;
        index pisagem.html;
    }
    location /ors/ {
        set $ors ors;
        rewrite ^/ors/(.*)$ /ors/$1 break;
        proxy_pass http://$ors:8082;
        proxy_read_timeout 120s;
    }
    location /overpass/ {
        set $overpass overpass;
        rewrite ^/overpass/(.*)$ /api/$1 break;
        proxy_pass http://$overpass:80;
        proxy_read_timeout 120s;
    }
    location /photon/ {
        set $photon photon;
        rewrite ^/photon/(.*)$ /$1 break;
        proxy_pass http://$photon:2322;
    }
}
