# Pisagem: everything in one box (LXC 126). Open http://<box-ip>/ and it just works.
services:
  web:
    image: nginx:1.27-alpine
    container_name: web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ors, overpass, photon]

  ors:
    image: openrouteservice/openrouteservice:v9.0.0
    container_name: ors
    restart: unless-stopped
    volumes:
      - ./ors:/home/ors
    environment:
      XMS: 1g
      XMX: ${ORS_XMX:-4g}

  overpass:
    image: wiktorn/overpass-api:latest
    container_name: overpass
    restart: unless-stopped
    volumes:
      - ./overpass:/db
    environment:
      OVERPASS_META: "no"
      OVERPASS_MODE: "init"
      OVERPASS_PLANET_URL: "https://download.geofabrik.de/europe/portugal-latest.osm.pbf"
      OVERPASS_PLANET_PREPROCESS: "mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf"
      OVERPASS_DIFF_URL: "https://download.geofabrik.de/europe/portugal-updates/"
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_USE_AREAS: "false"

  photon:
    image: rtuszik/photon-docker:latest
    container_name: photon
    restart: unless-stopped
    volumes:
      - ./photon:/photon/data
    environment:
      REGION: "pt"
      UPDATE_STRATEGY: "PARALLEL"
      UPDATE_INTERVAL: "30d"
