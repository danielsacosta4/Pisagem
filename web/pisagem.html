/* ---------- routing ---------- */
// The free key allows a limited number of route requests per minute. Stay under it by spacing requests out.
const RATE_PER_MIN = 30;
const sentAt = [];
async function throttle() {
  if (orsServer) return;   // your own server has no per-minute limit
  for (;;) {
    const now = Date.now();
    while (sentAt.length && now - sentAt[0] > 60000) sentAt.shift();
    if (sentAt.length < RATE_PER_MIN) { sentAt.push(now); return; }
    const wait = 60000 - (now - sentAt[0]) + 200;
    setStatus(T(`Pausa de ${Math.ceil(wait / 1000)} s para respeitar o limite por minuto do serviço de rotas…`, `Pausing ${Math.ceil(wait / 1000)} s to stay within the routing service's per-minute limit…`));
    await new Promise(r => setTimeout(r, Math.min(wait, 5000)));
  }
}

async function orsRequest(profile, body) {
  await throttle();
  let res;
  try {
    res = await fetch(orsBase() + profile + "/geojson", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json", "Accept": "application/geo+json, application/json" }, orsServer ? {} : { "Authorization": apiKey }),
      body: JSON.stringify(body)
    });
  } catch (netErr) {
    // No readable answer. Either the connection failed, or the service refused (its limit replies can't be read from a local file).
    const err = new Error("no answer"); err.network = true; throw err;
  }
  if (!res.ok) {
    let msg = res.statusText, code = null;
    try { const j = await res.json(); const e = j.error || j; msg = (e && (e.message || e)) || msg; code = e && e.code; } catch {}
    const err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    err.status = res.status; err.code = code;
    throw err;
  }
  return res.json();
}

// Try with all preferences; if the service rejects an option, retry with the basics.
async function route(profile, body) {
  try { return await orsRequest(profile, body); }
  catch (e) {
    if (e.status !== 400 || e.code === 2010) throw e;
    const plain = JSON.parse(JSON.stringify(body));
    if (plain.options) delete plain.options.profile_params;
    plain.extra_info = ["waytype", "waycategory", "surface"];
    return orsRequest(profile, plain);
  }
}

function baseBody(o) {
  const foot = o.profile.startsWith("foot");
  const b = { elevation: true, instructions: false, extra_info: foot ? ["waytype", "waycategory", "surface", "green"] : ["waytype", "waycategory", "surface"] };
  const w = {};
  if (foot) {
    if (o.scenic || o.shade) w.green = { factor: o.shade ? 1 : 0.8 };
    if (o.quiet) w.quiet = { factor: 1 };
  } else {
    w.steepness_difficulty = { flat: 0, some: 1, hilly: 3 }[o.terrain];
  }
  if (Object.keys(w).length) b.options = { profile_params: { weightings: w } };
  return b;
}

function roundTripBody(o) {
  const b = baseBody(o);
  b.coordinates = [[o.start[1], o.start[0]]];
  b.options = Object.assign({}, b.options, {
    round_trip: { length: Math.round(o.length), points: 3 + Math.floor(Math.random() * 3), seed: Math.floor(Math.random() * 90000) }
  });
  return b;
}

function waypointBody(o, wps) {
  const b = baseBody(o);
  const pts = [o.start, ...wps.map(w => [w.lat, w.lon]), o.start];
  b.coordinates = pts.map(p => [p[1], p[0]]);
  b.radiuses = pts.map(() => 350);
  return b;
}

/* ---------- scenery (OpenStreetMap via Overpass) ---------- */
const CELL = 0.002; // ~200 m grid for scenery lookups
const PCELL = 0.01; // ~1 km grid indexing woods and parks, for "is this point inside one?"
async function loadScenery(center, radius) {
  const key = `${center[0].toFixed(3)},${center[1].toFixed(3)},${Math.round(radius / 500)}`;
  if (scenicCache.has(key)) return scenicCache.get(key);
  const a = `(around:${Math.round(radius)},${center[0]},${center[1]})`;
  // big pine and eucalyptus forests are usually multipolygon relations, so ask for those too
  const q = `[out:json][timeout:40];(
    node["tourism"="viewpoint"]${a};
    node["natural"="peak"]${a};
    way["leisure"~"^(park|nature_reserve)$"]${a};
    way["landuse"="forest"]${a};
    way["natural"~"^(wood|water|beach)$"]${a};
    way["waterway"~"^(river|canal|stream)$"]${a};
    way["natural"="coastline"]${a};
    rel["landuse"="forest"]${a};
    rel["natural"~"^(wood|water)$"]${a};
    rel["leisure"~"^(park|nature_reserve)$"]${a};
  );out geom qt;`;
  const res = await overpass(q);
  if (!res.ok) throw new Error("Scenery lookup failed (" + res.status + ")");
  const data = await res.json();
  const scenery = buildScenery(data.elements || []);
  scenicCache.set(key, scenery);
  return scenery;
}

function sceneryType(t) {
  if (t.tourism === "viewpoint") return "viewpoint";
  if (t.natural === "peak") return "peak";
  if (t.natural === "water" || t.waterway || t.natural === "coastline" || t.natural === "beach") return "water";
  if (t.leisure) return "park";
  return "woods";
}

function buildScenery(elements) {
  const grid = new Map(), water = new Map();
  const anchors = [], polys = [], pindex = new Map();
  const addTo = (g, lat, lon) => {
    const k = `${Math.floor(lat / CELL)},${Math.floor(lon / CELL)}`;
    let arr = g.get(k); if (!arr) g.set(k, arr = []);
    arr.push([lat, lon]);
  };
  const addLine = (g, line, step) => {
    for (let i = 0; i < line.length; i++) {
      addTo(g, line[i].lat, line[i].lon);
      if (i < line.length - 1) { // fill long edges so the grid has no gaps
        const d = haversine([line[i].lat, line[i].lon], [line[i + 1].lat, line[i + 1].lon]);
        const steps = Math.floor(d / step);
        for (let s = 1; s < steps; s++) {
          const f = s / steps;
          addTo(g, line[i].lat + (line[i + 1].lat - line[i].lat) * f, line[i].lon + (line[i + 1].lon - line[i].lon) * f);
        }
      }
    }
  };
  // woods and parks as areas: every edge of every ring (outer and inner) feeds an even-odd inside test
  const addArea = (type, rings) => {
    const segs = [];
    let s = 90, n = -90, w = 180, e = -180;
    for (const r of rings) for (let i = 0; i < r.length - 1; i++) {
      segs.push(r[i].lat, r[i].lon, r[i + 1].lat, r[i + 1].lon);
      s = Math.min(s, r[i].lat); n = Math.max(n, r[i].lat); w = Math.min(w, r[i].lon); e = Math.max(e, r[i].lon);
    }
    if (segs.length < 12) return;
    const id = polys.push({ type, bbox: [s, w, n, e], segs: Float64Array.from(segs) }) - 1;
    for (let ci = Math.floor(s / PCELL); ci <= Math.floor(n / PCELL); ci++)
      for (let cj = Math.floor(w / PCELL); cj <= Math.floor(e / PCELL); cj++) {
        const k = `${ci},${cj}`; let arr = pindex.get(k); if (!arr) pindex.set(k, arr = []); arr.push(id);
      }
  };
  for (const el of elements) {
    const t = el.tags || {}, type = sceneryType(t);
    if (el.type === "node") {
      addTo(grid, el.lat, el.lon);
      anchors.push({ lat: el.lat, lon: el.lon, type, name: t.name || "" });
      continue;
    }
    const lines = el.type === "relation"
      ? (el.members || []).filter(m => m.type === "way" && m.geometry && m.geometry.length > 1).map(m => m.geometry.filter(Boolean))
      : (el.geometry && el.geometry.length ? [el.geometry] : []);
    if (!lines.length) continue;
    for (const g of lines) {
      addLine(grid, g, 120);
      if (type === "water") addLine(water, g, 40);
    }
    if (type === "woods" || type === "park") {
      // a way is an area when it closes on itself; a relation's members join up into rings
      const closed = el.type === "relation" || (lines[0].length > 3 && lines[0][0].lat === lines[0][lines[0].length - 1].lat && lines[0][0].lon === lines[0][lines[0].length - 1].lon);
      if (closed) addArea(type, lines);
    }
    // a few edge points per feature become possible waypoints (edges are reachable, centres of lakes are not)
    const g = lines[0];
    const picks = g.length > 2 ? [0, Math.floor(g.length / 3), Math.floor(2 * g.length / 3)] : [0];
    for (const i of picks) anchors.push({ lat: g[i].lat, lon: g[i].lon, type, name: t.name || "" });
  }
  return { grid, water, anchors, polys, pindex };
}

function nearGrid(grid, lat, lon, within) {
  const ci = Math.floor(lat / CELL), cj = Math.floor(lon / CELL);
  for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
    const arr = grid.get(`${ci + di},${cj + dj}`);
    if (!arr) continue;
    for (const p of arr) if (haversine([lat, lon], p) <= within) return true;
  }
  return false;
}
function nearScenery(scenery, lat, lon, within = 200) { return nearGrid(scenery.grid, lat, lon, within); }

// which kind of area (woods / park) a point is inside, or null
function areaAt(scenery, lat, lon) {
  if (!scenery || !scenery.pindex) return null;
  const ids = scenery.pindex.get(`${Math.floor(lat / PCELL)},${Math.floor(lon / PCELL)}`);
  if (!ids) return null;
  let found = null;
  for (const id of ids) {
    const p = scenery.polys[id], b = p.bbox;
    if (lat < b[0] || lat > b[2] || lon < b[1] || lon > b[3]) continue;
    let inside = false;
    const s = p.segs;
    for (let i = 0; i < s.length; i += 4) {
      const y1 = s[i], x1 = s[i + 1], y2 = s[i + 2], x2 = s[i + 3];
      if ((y1 > lat) !== (y2 > lat) && lon < x1 + (lat - y1) * (x2 - x1) / (y2 - y1)) inside = !inside;
    }
    if (inside) { if (p.type === "woods") return "woods"; found = "park"; }
  }
  return found;
}

/* ---------- official Portuguese trails (PR / GR / PL, as mapped in OpenStreetMap) ---------- */
const officialCache = new Map();
async function loadOfficial(center, radius) {
  const key = `${center[0].toFixed(3)},${center[1].toFixed(3)},${Math.round(radius / 500)}`;
  if (officialCache.has(key)) return officialCache.get(key);
  const dLat = radius / 111320, dLon = radius / (111320 * Math.cos(rad(center[0])));
  const bb = [center[0] - dLat, center[1] - dLon, center[0] + dLat, center[1] + dLon].map(v => v.toFixed(5)).join(",");
  // out geom(bbox) clips long GR routes to the area around the start
  const q = `[out:json][timeout:25];rel["route"~"^(hiking|foot)$"]["ref"~"^ *(PR|GR|PL) *[0-9]",i](${bb});out geom(${bb});`;
  const res = await overpass(q);
  if (!res.ok) throw new Error("Official trail lookup failed (" + res.status + ")");
  const data = await res.json();
  const grid = new Map(), anchors = [], trails = [];
  for (const rel of data.elements || []) {
    const t = rel.tags || {};
    const trail = { id: rel.id, ref: (t.ref || "").trim(), name: t.name || "", lines: [] };
    for (const mem of rel.members || []) {
      if (mem.type !== "way" || !mem.geometry) continue;
      const g = mem.geometry.filter(Boolean);
      if (g.length < 2) continue;
      trail.lines.push(g.map(p => [p.lat, p.lon]));
      let since = 0;
      for (let i = 0; i < g.length; i++) {
        gridAdd(grid, g[i].lat, g[i].lon);
        if (i < g.length - 1) {
          const d = haversine([g[i].lat, g[i].lon], [g[i + 1].lat, g[i + 1].lon]);
          const steps = Math.floor(d / 30);
          for (let s = 1; s < steps; s++) { const f = s / steps; gridAdd(grid, g[i].lat + (g[i + 1].lat - g[i].lat) * f, g[i].lon + (g[i + 1].lon - g[i].lon) * f); }
          since += d;
          if (since > 300) { anchors.push({ lat: g[i + 1].lat, lon: g[i + 1].lon, type: "trail", name: trail.ref + (trail.name ? " " + trail.name : "") }); since = 0; }
        }
      }
    }
    if (trail.lines.length) trails.push(trail);
  }
  const result = { grid, anchors, trails };
  officialCache.set(key, result);
  return result;
}

function gridAdd(grid, lat, lon) {
  const k = `${Math.floor(lat / CELL)},${Math.floor(lon / CELL)}`;
  let arr = grid.get(k); if (!arr) grid.set(k, arr = []);
  arr.push([lat, lon]);
}

let lastOfficial = null;
function drawOfficial(official) {
  lastOfficial = official;
  officialLayer.clearLayers();
  if (!official) return;
  const color = css("--official");
  for (const t of official.trails) {
    const label = `<b>${t.ref}</b>${t.name ? "<br>" + t.name : ""}<br><a href="https://www.openstreetmap.org/relation/${t.id}" target="_blank" rel="noopener">${T("Ver no OpenStreetMap", "View on OpenStreetMap")}</a>`;
    L.polyline(t.lines, { color, weight: 3, opacity: .85, dashArray: "8 5" }).bindPopup(label).addTo(officialLayer);
  }
}

/* ---------- sidewalks and street lighting ---------- */
const ROAD_CLASSES = new Set(["trunk", "trunk_link", "primary", "primary_link", "secondary", "secondary_link", "tertiary", "tertiary_link", "unclassified", "road"]);
const DARK_UNTAGGED = new Set(["path", "track", "bridleway"]);   // unmapped trails are almost always unlit
const LIT_YES = /^(yes|24\/7|automatic|limited|interval|sunset-sunrise|dusk-dawn)$/;
const NIGHT_AVOID = new Set(["woods", "park", "peak", "trail"]);
const FIRE_AVOID = new Set(["woods", "peak", "trail"]);      // IPMA level 4–5: no waypoints in or across the woods
const SHADE_TYPES = new Set(["woods", "park", "water"]);
const SEG_CELL = 0.0005; // ~50 m

function sampleLine(m, step) {
  const out = [];
  for (let d = 0, i = 0; d <= m.cum[m.cum.length - 1]; d += step) {
    while (i < m.cum.length - 1 && m.cum[i + 1] < d) i++;
    out.push([m.pts[i][0], m.pts[i][1]]);
  }
  const last = m.pts[m.pts.length - 1]; out.push([last[0], last[1]]);
  return out;
}

// One Overpass request fetches every road and path within 15 m of the candidate routes.
async function loadWaysAlong(lines) {
  const stmts = lines.map(l => `way["highway"](around:15,${l.map(p => p[0].toFixed(5) + "," + p[1].toFixed(5)).join(",")});`).join("");
  const q = `[out:json][timeout:40];(${stmts});out geom qt;`;
  const res = await overpass(q);
  if (!res.ok) throw new Error("Road lookup failed (" + res.status + ")");
  const data = await res.json();
  return buildWayIndex(data.elements || []);
}

function buildWayIndex(elements) {
  const grid = new Map();
  for (const el of elements) {
    if (el.type !== "way" || !el.geometry) continue;
    const w = { tags: el.tags || {} };
    const g = el.geometry.filter(Boolean);
    for (let i = 0; i < g.length - 1; i++) {
      const a = [g[i].lat, g[i].lon], b = [g[i + 1].lat, g[i + 1].lon];
      const i0 = Math.floor(Math.min(a[0], b[0]) / SEG_CELL), i1 = Math.floor(Math.max(a[0], b[0]) / SEG_CELL);
      const j0 = Math.floor(Math.min(a[1], b[1]) / SEG_CELL), j1 = Math.floor(Math.max(a[1], b[1]) / SEG_CELL);
      if ((i1 - i0 + 1) * (j1 - j0 + 1) > 400) continue;
      for (let ci = i0; ci <= i1; ci++) for (let cj = j0; cj <= j1; cj++) {
        const k = ci + "," + cj;
        let arr = grid.get(k); if (!arr) grid.set(k, arr = []);
        arr.push({ w, a, b });
      }
    }
  }
  return { grid };
}

function segDist(lat, lon, a, b) { // metres from point to segment, local flat projection
  const kx = 111320 * Math.cos(rad(lat)), ky = 110540;
  const ax = (a[1] - lon) * kx, ay = (a[0] - lat) * ky, bx = (b[1] - lon) * kx, by = (b[0] - lat) * ky;
  const dx = bx - ax, dy = by - ay, len = dx * dx + dy * dy;
  const t = len ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len)) : 0;
  return Math.hypot(ax + t * dx, ay + t * dy);
}

function waysNear(index, lat, lon, within) {
  const ci = Math.floor(lat / SEG_CELL), cj = Math.floor(lon / SEG_CELL);
  const best = new Map();
  for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
    const arr = index.grid.get((ci + di) + "," + (cj + dj));
    if (!arr) continue;
    for (const s of arr) {
      const d = segDist(lat, lon, s.a, s.b);
      if (d <= within && (!best.has(s.w) || best.get(s.w) > d)) best.set(s.w, d);
    }
  }
  return [...best].map(([w, d]) => ({ w, d })).sort((p, q) => p.d - q.d);
}

function sidewalkOf(t) {
  const has = v => v === "yes" || v === "separate" || v === "both" || v === "left" || v === "right";
  if (has(t.sidewalk) || has(t["sidewalk:both"]) || has(t["sidewalk:left"]) || has(t["sidewalk:right"])) return "yes";
  if (t.sidewalk === "no" || t.sidewalk === "none" || t["sidewalk:both"] === "no" ||
      (t["sidewalk:left"] === "no" && t["sidewalk:right"] === "no")) return "no";
  return "unknown";
}

function lightOf(t) {
  if (t.lit && LIT_YES.test(t.lit)) return "lit";
  if (t.lit === "no" || t.lit === "disused") return "dark";
  if (DARK_UNTAGGED.has(t.highway)) return "dark";
  return "unknown";
}

// Walks the route every 20 m, matches each point to the way it is on, and records
// sidewalk and lighting status plus the longest bad stretch of each.
function roadsideCheck(m, index) {
  const STEP = 20, total = m.cum[m.cum.length - 1];
  const r = { totalM: 0, litM: 0, darkM: 0, unknownLightM: 0, roadM: 0, yesSidewalkM: 0, noSidewalkM: 0, unknownSidewalkM: 0,
              longestDark: 0, longestNoSidewalk: 0, longestRoundabout: 0, runs: [] };
  let darkRun = 0, noRun = 0, darkStart = -1, noStart = -1, ringRun = 0;
  const close = (type, startIdx, endIdx) => { if (startIdx >= 0 && endIdx > startIdx) r.runs.push({ type, from: startIdx, to: endIdx }); };
  let i = 0;
  for (let d = 0; d <= total; d += STEP) {
    while (i < m.cum.length - 1 && m.cum[i + 1] < d) i++;
    const [lat, lon] = m.pts[i];
    const near = waysNear(index, lat, lon, 15);
    const on = near.length && near[0].d <= 12 ? near[0].w : null;
    r.totalM += STEP;

    const ring = on && (on.tags.junction === "roundabout" || on.tags.junction === "circular");
    ringRun = ring ? ringRun + STEP : 0;
    r.longestRoundabout = Math.max(r.longestRoundabout, ringRun);

    const light = on ? lightOf(on.tags) : "unknown";
    if (light === "lit") r.litM += STEP; else if (light === "dark") r.darkM += STEP; else r.unknownLightM += STEP;
    if (light === "dark") { if (darkStart < 0) darkStart = i; darkRun += STEP; r.longestDark = Math.max(r.longestDark, darkRun); }
    else { if (darkRun >= 60) close("unlit", darkStart, i); darkRun = 0; darkStart = -1; }

    let side = null;
    if (on && ROAD_CLASSES.has(on.tags.highway)) {
      side = near.some(x => x.w.tags.footway === "sidewalk" && x.d <= 15) ? "yes" : sidewalkOf(on.tags);
      r.roadM += STEP;
      if (side === "yes") r.yesSidewalkM += STEP; else if (side === "no") r.noSidewalkM += STEP; else r.unknownSidewalkM += STEP;
    }
    if (side === "no") { if (noStart < 0) noStart = i; noRun += STEP; r.longestNoSidewalk = Math.max(r.longestNoSidewalk, noRun); }
    else { if (noRun >= 40) close("nosidewalk", noStart, i); noRun = 0; noStart = -1; }
  }
  if (darkRun >= 60) close("unlit", darkStart, m.pts.length - 1);
  if (noRun >= 40) close("nosidewalk", noStart, m.pts.length - 1);
  return r;
}

/* ---------- dead ends ---------- */
// A dead end shows up as a spur: the route goes in at least 30 m and comes back out the same way,
// so the points 30 m before and after the tip are on top of each other.
function countSpurs(pts, cum) {
  const n = pts.length, total = cum[n - 1];
  let spurs = 0, a = 0, b = 0, skipUntil = -1;
  for (let i = 0; i < n; i++) {
    if (cum[i] < 60 || total - cum[i] < 60 || cum[i] < skipUntil) continue;
    while (a + 1 < n && cum[a + 1] <= cum[i] - 30) a++;
    if (b < i) b = i;
    while (b < n - 1 && cum[b] < cum[i] + 30) b++;
    if (haversine(pts[a], pts[b]) < 6 && haversine(pts[i], pts[a]) > 20) { spurs++; skipUntil = cum[i] + 60; }
  }
  return spurs;
}

// A detour is a U-turn on roads: the route goes out and comes back along a parallel road, so the
// points w metres before and after the turn are close together. Steep hairpins (a real climb) are allowed.
function idxAt(cum, d) { let lo = 0, hi = cum.length - 1; while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < d) lo = mid + 1; else hi = mid; } return lo; }
function countDetours(pts, cum, wtAt) {
  const total = cum[cum.length - 1];
  let detours = 0, skipUntil = -1;
  for (const w of [100, 200]) {
    for (let i = 0; i < pts.length; i++) {
      if (cum[i] < 2 * w || total - cum[i] < 2 * w || cum[i] < skipUntil) continue;
      if (![1, 2, 3].includes(wtAt[i])) continue;                 // only on roads and streets
      const a = idxAt(cum, cum[i] - w), b = idxAt(cum, cum[i] + w);
      // U shape: the two legs end much closer to each other than to the turn (a turn sharper than about 40°)
      const gap = haversine(pts[a], pts[b]);
      const mid = [(pts[a][0] + pts[b][0]) / 2, (pts[a][1] + pts[b][1]) / 2];
      const depth = haversine(pts[i], mid);
      if (depth > 0.5 * w && gap < 0.7 * depth) {
        const climb = Math.abs(pts[b][2] - pts[a][2]) + Math.abs(pts[i][2] - pts[a][2]);
        if (climb / (2 * w) > 0.08) continue;                     // steep hairpin on a climb, keep it
        detours++; skipUntil = cum[i] + w;
      }
    }
  }
  return detours;
}

const ANCHOR_WEIGHT = { viewpoint: 3, peak: 2.5, water: 2, trail: 2, park: 1.5, woods: 1.3 };
function pickWaypoints(scenery, o) {
  // Triangle loop: two waypoints 100° apart, sized so the road distance lands near the target.
  const r = o.length / 4.6;
  const theta = Math.random() * 360;
  const used = new Set(), picked = [];
  for (const bearing of [theta - 50, theta + 50]) {
    const target = destination(o.start, bearing, r);
    const pool = scenery.anchors
      .map((a, i) => ({ a, i, d: haversine(target, [a.lat, a.lon]) }))
      .filter(x => x.d < r * 0.45 && !used.has(x.i) && !(o.night && NIGHT_AVOID.has(x.a.type)) && !(o.noForest && FIRE_AVOID.has(x.a.type)));
    if (!pool.length) return null;
    const weightOf = x => {
      let w = ANCHOR_WEIGHT[x.a.type] || 1;
      if (o.shade && SHADE_TYPES.has(x.a.type)) w *= 2.5;     // on hot days, aim for trees and water
      if (x.a.type === "peak" && o.terrain === "flat") w = 0.4;
      return w / (1 + x.d / r) * (0.5 + Math.random());
    };
    pool.sort((p, q) => weightOf(q) - weightOf(p));
    const best = pool[0];
    used.add(best.i); picked.push(best.a);
  }
  return picked;
}

/* ---------- measuring and scoring ---------- */
function analyse(feature, o, scenery, official) {
  const coords = feature.geometry.coordinates; // [lon, lat, ele]
  const pts = coords.map(c => [c[1], c[0], c[2] ?? 0]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + haversine(pts[i - 1], pts[i]));
  const total = cum[cum.length - 1] || 1;
  const props = feature.properties || {};
  const distance = (props.summary && props.summary.distance) || total;

  // climb: use the service's figure, otherwise sum smoothed rises
  let ascent = props.ascent;
  if (ascent == null) {
    ascent = 0;
    for (let i = 1; i < pts.length; i++) { const d = pts[i][2] - pts[i - 1][2]; if (d > 0) ascent += d; }
  }

  // steepest 200 m stretch, either direction
  let maxGrade = 0;
  for (let i = 0, j = 0; i < pts.length; i++) {
    while (j < pts.length - 1 && cum[j] - cum[i] < 200) j++;
    const run = cum[j] - cum[i];
    if (run >= 150) maxGrade = Math.max(maxGrade, Math.abs(pts[j][2] - pts[i][2]) / run * 100);
  }

  // share of distance on main roads (ORS waytype 1 = state road, 2 = road)
  let busy = 0;
  const wt = props.extras && props.extras.waytype;
  if (wt) for (const [a, b, v] of wt.values) if (v === 1 || v === 2) busy += cum[Math.min(b, cum.length - 1)] - cum[a];
  const busyShare = busy / total;

  // Roads people shouldn't walk or cycle along: any motorway, or more than 100 m in one go
  // on a trunk/primary road (ORS waytype 1). Short stretches are allowed so routes can cross them.
  let longestMain = 0, run = 0, runEnd = -1, motorway = false;
  if (wt) for (const [a, b, v] of wt.values) {
    if (v === 1) {
      run = (a === runEnd ? run : 0) + (cum[Math.min(b, cum.length - 1)] - cum[a]);
      runEnd = b; longestMain = Math.max(longestMain, run);
    } else { run = 0; runEnd = -1; }
  }
  const wc = props.extras && props.extras.waycategory;
  if (wc) for (const [, , v] of wc.values) if (v & 1) motorway = true;
  const unsafeRoad = motorway || longestMain > 100;

  // scenery share: sample every 100 m and check for parks, woods, water, viewpoints nearby
  let sceneShare = null;
  if (scenery) {
    let hits = 0, n = 0;
    for (let d = 0, i = 0; d <= total; d += 100) {
      while (i < cum.length - 1 && cum[i + 1] < d) i++;
      n++; if (nearScenery(scenery, pts[i][0], pts[i][1])) hits++;
    }
    sceneShare = n ? hits / n : 0;
  }
  const green = props.extras && props.extras.green;
  if (green) {
    let g = 0;
    for (const [a, b, v] of green.values) g += (cum[Math.min(b, cum.length - 1)] - cum[a]) * v / 10;
    const gShare = g / total;
    sceneShare = sceneShare == null ? gShare : (sceneShare + gShare) / 2;
  }

  // share on official trails: sample every 50 m, within 40 m of a PR/GR line
  let officialShare = null;
  if (official) {
    let hits = 0, n = 0;
    for (let d = 0, i = 0; d <= total; d += 50) {
      while (i < cum.length - 1 && cum[i + 1] < d) i++;
      n++; if (nearScenery(official, pts[i][0], pts[i][1], 40)) hits++;
    }
    officialShare = n ? hits / n : 0;
  }

  // shade (inside woods or parks, or beside water) and forest (inside woods), sampled every 50 m
  let shadeShare = null, forestShare = null;
  if (scenery && scenery.pindex) {
    let sh = 0, fo = 0, n = 0;
    for (let d = 0, i = 0; d <= total; d += 50) {
      while (i < cum.length - 1 && cum[i + 1] < d) i++;
      const area = areaAt(scenery, pts[i][0], pts[i][1]);
      n++;
      if (area === "woods") fo++;
      if (area || nearGrid(scenery.water, pts[i][0], pts[i][1], 50)) sh++;
    }
    shadeShare = n ? sh / n : null; forestShare = n ? fo / n : null;
  }

  const spurs = countSpurs(pts, cum);
  const wtAt = new Array(pts.length).fill(0);
  if (wt) for (const [a, b, v] of wt.values) for (let k = a; k < b && k < wtAt.length; k++) wtAt[k] = v;
  const detours = countDetours(pts, cum, wtAt);
  const duration = (props.summary && props.summary.duration) || 0;
  // road-type mix, by distance
  const mixM = {};
  if (wt) for (const [a, b, v] of wt.values) mixM[v] = (mixM[v] || 0) + cum[Math.min(b, cum.length - 1)] - cum[a];
  const wayMix = Object.entries(mixM).map(([v, d]) => ({ type: Number(v), share: d / total })).filter(x => x.share > 0.002).sort((p, q) => q.share - p.share);

  // share of the route you have never done, against your imported workouts
  let newShare = null;
  if (visitedGrid) {
    let hit = 0, n = 0;
    for (let d = 0, i = 0; d <= total; d += 50) {
      while (i < cum.length - 1 && cum[i + 1] < d) i++;
      n++; if (nearVisited(pts[i][0], pts[i][1])) hit++;
    }
    newShare = n ? 1 - hit / n : null;
  }

  return { pts, cum, distance, ascent, maxGrade, busyShare, sceneShare, officialShare, spurs, detours, unsafeRoad, longestMain, wayMix, newShare, duration, shadeShare, forestShare, surface: surfaceMix(props, cum, total) };
}

function score(m, o) {
  const t = TERRAIN[o.terrain];
  const perKm = m.ascent / (m.distance / 1000);
  const issues = [];
  let penalty = 0;

  const distErr = Math.abs(m.distance - o.length) / o.length;
  penalty += distErr * 3;
  if (distErr > 0.15) issues.push(T(`${fmtKm(m.distance)} km em vez de ${fmtKm(o.length)} km`, `${fmtKm(m.distance)} km instead of ${fmtKm(o.length)} km`));

  if (perKm < t.min) { penalty += (t.min - perKm) / 8; issues.push(T(`mais plano do que pediste (${perKm.toFixed(0)} m/km)`, `flatter than asked (${perKm.toFixed(0)} m/km)`)); }
  if (perKm > t.max) { penalty += (perKm - t.max) / 8; issues.push(T(`mais subidas do que pediste (${perKm.toFixed(0)} m/km)`, `hillier than asked (${perKm.toFixed(0)} m/km)`)); }
  if (m.maxGrade > t.maxGrade) { penalty += (m.maxGrade - t.maxGrade) / 5; issues.push(T(`um troço com ${m.maxGrade.toFixed(0)}%`, `one stretch of ${m.maxGrade.toFixed(0)}%`)); }

  if (o.quiet) {
    penalty += m.busyShare * 6;
    if (m.busyShare > BUSY_LIMIT) issues.push(T(`${(m.busyShare * m.distance).toFixed(0)} m em estradas principais`, `${(m.busyShare * m.distance).toFixed(0)} m on main roads`));
  }
  if (o.scenic && m.sceneShare != null) {
    penalty += (1 - m.sceneShare) * 2;
    if (m.sceneShare < SCENIC_TARGET) issues.push(T(`só ${(m.sceneShare * 100).toFixed(0)}% perto de paisagem`, `only ${(m.sceneShare * 100).toFixed(0)}% near scenery`));
  }
  const rs = m.roadside;
  if (o.night && rs) {
    const lit = rs.litM / (rs.totalM || 1), unknown = rs.unknownLightM / (rs.totalM || 1);
    penalty += (rs.darkM / (rs.totalM || 1)) * 4 + unknown * 1.5;
    if (lit < 0.6) issues.push(T(`${(lit * 100).toFixed(0)}% com luz confirmada, ${(unknown * 100).toFixed(0)}% sem dados`, `${(lit * 100).toFixed(0)}% confirmed lit, ${(unknown * 100).toFixed(0)}% unknown`));
  }
  if (o.sidewalks && rs && rs.roadM > 0) penalty += (rs.noSidewalkM / rs.roadM) * 2;
  if (o.fresh && m.newShare != null) {
    penalty += (1 - m.newShare) * 3;
    if (m.newShare < 0.5) issues.push(T(`só ${(m.newShare * 100).toFixed(0)}% de caminho novo`, `only ${(m.newShare * 100).toFixed(0)}% new to you`));
  }
  if (o.shade && m.shadeShare != null) {
    penalty += (1 - m.shadeShare) * 2.5;
    if (m.shadeShare < 0.3) issues.push(T(`só ${(m.shadeShare * 100).toFixed(0)}% à sombra`, `only ${(m.shadeShare * 100).toFixed(0)}% in shade`));
  }
  if (o.noForest && m.forestShare != null) {
    penalty += m.forestShare * 10;
    if (m.forestShare > 0.05) issues.push(T(`${(m.forestShare * 100).toFixed(0)}% dentro de matas`, `${(m.forestShare * 100).toFixed(0)}% inside woods`));
  }
  const su = m.surface;
  if (su && o.profile === "cycling-regular") {     // road bikes: dirt and cobbles hurt
    penalty += su.unpaved * 4 + su.stones * 1.5;
    if (su.unpaved > 0.05) issues.push(T(`${(su.unpaved * 100).toFixed(0)}% sem pavimento`, `${(su.unpaved * 100).toFixed(0)}% unpaved`));
  }
  if (o.official && m.officialShare != null) {
    penalty += (1 - m.officialShare) * 3;
    if (m.officialShare < 0.5) issues.push(T(`só ${(m.officialShare * 100).toFixed(0)}% em trilhos oficiais`, `only ${(m.officialShare * 100).toFixed(0)}% on official trails`));
  }
  return { penalty, issues, perKm, fits: issues.length === 0 };
}

/* ---------- main flow ---------- */
$("go").addEventListener("click", generate);
$("go-more").addEventListener("click", generate);
$("again").addEventListener("click", generate);

async function generate() {
  if (genBusy) return;
  if (!hasRouting()) return openSettings(T("Primeiro cola a tua chave do OpenRouteService.", "Add your OpenRouteService key first."));
  if (!start) return setStatus(T("Toca no mapa ou procura um lugar para marcar a partida.", "Tap the map or search a place to set the start."), true);

  const activity = val("activity");
  const o = {
    start, profile: PROFILES[activity], terrain: val("terrain"),
    length: Number($("dist").value) * 1000, scenic: $("scenic").checked, quiet: $("quiet").checked,
    official: activity === "hike" && $("official").checked,
    night: $("night").checked
  };
  o.sidewalks = o.profile.startsWith("foot");
  o.fresh = !!visitedGrid && $("wk-fresh").checked;
  Object.assign(o, dayOptions());
  const btns = ["go", "go-more", "again"].map($);
  genBusy = true;
  btns.forEach(b => { b.disabled = true; b.textContent = T("A procurar…", "Finding routes…"); });
  $("notice").innerHTML = "";

  try {
    const radius = Math.min(o.length * 0.4, 12000);
    const [sc, of] = await Promise.allSettled([
      o.scenic || o.shade || o.noForest ? (setStatus(T("À procura de miradouros, parques, matas e água por perto…", "Looking for viewpoints, parks, woods and water nearby…")), loadScenery(o.start, radius)) : null,
      o.official ? loadOfficial(o.start, radius) : null
    ]);
    const scenery = sc.status === "fulfilled" ? sc.value : null;
    let official = of.status === "fulfilled" ? of.value : null;
    if (official && !official.trails.length) official = null;
    if (o.official) {
      drawOfficial(official);
      if (!official) $("notice").innerHTML = `<div class="notice">${T("Não há trilhos PR/GR mapeados perto desta partida, por isso os percursos usam caminhos comuns.", "No official PR/GR trails are mapped near this start, so routes use ordinary paths.")}</div>`;
    } else officialLayer.clearLayers();
    o.official = !!official;

    // Waypoints come from official trails when hiking on them, otherwise from scenic spots.
    const anchorSource = official && !o.night && !o.noForest ? official : scenery;
    if (o.noForest) $("notice").innerHTML += `<div class="notice warn">${fireNotice()}</div>`;
    if (o.noForest && !scenery) $("notice").innerHTML += `<div class="notice warn">${T("Não deu para saber onde ficam as matas (o serviço de mapas não respondeu). Tem cuidado.", "Couldn't find where the woods are (the map data service didn't answer). Take care.")}</div>`;
    if (official && o.night) $("notice").innerHTML += `<div class="notice">${T("Depois de escurecer está ligado, por isso os percursos ficam em ruas iluminadas em vez de seguir trilhos PR/GR.", "After dark is on, so routes stay on lit streets instead of following PR/GR trails.")}</div>`;

    const MAX_ROUNDS = 3;
    let pool = [], forestRej = 0, deadEnds = 0, mainRoads = 0, noSidewalk = 0, unlit = 0, rings = 0, failures = 0, lastErr = null, roadsideFailed = false;
    for (let round = 0; round < MAX_ROUNDS; round++) {
      setStatus(round === 0 ? T(`A planear ${N_CANDIDATES} percursos…`, `Planning ${N_CANDIDATES} routes…`) : T(`A tentar mais percursos (${round + 1} de ${MAX_ROUNDS})…`, `Trying more routes (${round + 1} of ${MAX_ROUNDS})…`));
      const jobs = [];
      for (let k = 0; k < N_CANDIDATES; k++) {
        let wps = null;
        if (anchorSource && k % 2 === 0) wps = pickWaypoints(anchorSource, o);
        const body = wps ? waypointBody(o, wps) : roundTripBody(o);
        jobs.push(route(o.profile, body).then(fc => ({ fc, wps })));
      }
      const results = await Promise.allSettled(jobs);
      const survivors = [];
      let survivorsSeen = false;
      for (const r of results) {
        if (r.status === "rejected") { failures++; lastErr = r.reason; continue; }
        const f = r.value.fc.features && r.value.fc.features[0];
        if (!f) continue;
        const m = analyse(f, o, scenery, official);
        if (m.spurs > 0 || m.detours > 0) { deadEnds++; continue; } // never offer dead ends or out-and-back detours
        if (m.unsafeRoad) { mainRoads++; continue; }      // or that follow a motorway or main road
        if (o.noForest && m.forestShare > 0.2) { forestRej++; continue; }   // high fire risk: keep out of the woods
        survivors.push({ m, wps: r.value.wps || [] });
        survivorsSeen = true;
      }

      // sidewalks and street lighting: look up the roads each route actually uses
      if (survivors.length && (o.sidewalks || o.night)) {
        setStatus(T("A verificar passeios e iluminação…", "Checking sidewalks and street lighting…"));
        let index = null;
        try { index = await loadWaysAlong(survivors.map(c => sampleLine(c.m, 60))); }
        catch { roadsideFailed = true; }
        if (index) for (const c of survivors) c.m.roadside = roadsideCheck(c.m, index);
      }
      for (const c of survivors) {
        const rs = c.m.roadside;
        if (rs && o.sidewalks && rs.longestNoSidewalk > 200) { noSidewalk++; continue; }
        if (rs && o.sidewalks && rs.longestRoundabout > 40) { rings++; continue; }  // walkers cross roundabouts, they don't circle them
        if (rs && o.night && rs.longestDark > 150) { unlit++; continue; }
        pool.push({ m: c.m, s: score(c.m, o), wps: c.wps, o });
      }
      // an unusable key or rate limit won't improve with more rounds
      if (lastErr && [401, 403, 429].includes(lastErr.status)) throw lastErr;
      if (lastErr && lastErr.network && results.every(r => r.status === "rejected")) throw lastErr;
      if (pool.some(c => c.s.fits) || pool.length >= 2) break;
      if (lastErr && lastErr.network && !pool.length && !survivorsSeen) break; // service not answering, more rounds won't help
    }

    if (!pool.length) {
      if (lastErr && !deadEnds && !mainRoads && !noSidewalk && !unlit && !rings && !forestRej) throw lastErr;
      const why = [deadEnds && T("becos sem saída ou desvios", "dead ends or detours"), mainRoads && T("estradas principais", "main roads"), noSidewalk && T("estradas sem passeio", "roads without sidewalks"), unlit && T("troços sem luz", "unlit stretches"), rings && T("rotundas", "roundabouts"), forestRej && T("matas (risco de incêndio)", "woods (fire risk)")].filter(Boolean);
      throw new Error(T(`Todos os percursos encontrados aqui tinham ${why.join(" ou ")}. Muda um pouco a partida ou a distância.`, `Every route found here ran into ${why.join(" or ")}. Try moving the start a little or changing the distance.`));
    }

    candidates = pool.sort((a, b) => a.s.penalty - b.s.penalty).slice(0, 5);
    editCtx = { scenery, official };

    if (!candidates[0].s.fits) {
      $("notice").innerHTML += `<div class="notice warn">${T("Nenhum percurso cumpre todas as opções perto desta partida. Mostramos primeiro o mais próximo; as notas a amarelo dizem onde fica aquém.", "No route matched every option near this start. The closest match is shown first; the yellow notes say where it falls short.")}</div>`;
    }
    const skipped = [];
    if (deadEnds) skipped.push(T(`${deadEnds} com becos sem saída ou desvios`, `${deadEnds} with dead ends or detours`));
    if (rings) skipped.push(T(`${rings} à volta de rotundas`, `${rings} going around roundabouts`));
    if (mainRoads) skipped.push(T(`${mainRoads} por estradas principais`, `${mainRoads} along main roads`));
    if (noSidewalk) skipped.push(T(`${noSidewalk} por estradas sem passeio`, `${noSidewalk} on roads without sidewalks`));
    if (unlit) skipped.push(T(`${unlit} com troços sem luz`, `${unlit} with unlit stretches`));
    if (forestRej) skipped.push(T(`${forestRej} por dentro de matas`, `${forestRej} through woods`));
    if (roadsideFailed) $("notice").innerHTML += `<div class="notice warn">${T("Não deu para verificar passeios e iluminação porque o serviço de mapas estava ocupado. Tenta outro percurso daqui a um minuto", "Sidewalks and lighting couldn't be checked this time because the map data service was busy. Try another route in a minute")}${o.night ? T(", e tem mais cuidado à noite", ", and take extra care after dark") : ""}.</div>`;
    setStatus(skipped.length ? T(`Percursos postos de lado: ${skipped.join(", ")}.`, `Skipped routes: ${skipped.join(", ")}.`) : "");
    planOpen = false; moreOpen = false; routesOf = "gen";
    renderOptions();
    select(0, true);
    refreshStops();
  } catch (e) {
    setStatus(explain(e), true);
  } finally {
    genBusy = false;
    btns.forEach(b => { b.disabled = false; });
    layout();
  }
}

function explain(e) {
  if (e.status === 401 || e.status === 403) return T("A chave de rotas foi recusada. Confirma-a nas Definições.", "The routing key was refused. Check it in Settings.");
  if (e.status === 429) return T("Demasiados pedidos para esta chave. Espera um minuto e tenta de novo.", "Too many requests for this key right now. Wait a minute and try again.");
  if (orsServer && /profile/i.test(e.message || "")) return T("O teu servidor de rotas ainda não tem este tipo de atividade. Por agora só tem A pé e Trilho; para bicicleta, ativa os perfis de ciclismo no servidor ou apaga o endereço nas definições para usar o serviço público.", "Your routing server doesn't have this activity yet. For now it only has Walk and Hike; for bikes, enable the cycling profiles on the server or clear the address in settings to use the public service.");
  if (e.code === 2010) return T("Não há caminho perto da partida. Põe a partida numa estrada ou trilho, ou ao lado.", "No path found near the start. Move the start onto or next to a road or trail.");
  if (e.network) return T("O serviço de rotas não respondeu. Se fizeste muitos percursos no último minuto, chegaste ao limite da chave grátis: espera um minuto e tenta de novo. Se não, verifica a ligação à internet.", "The routing service didn't answer. If you've made a lot of routes in the last minute, the free key's limit has probably been reached: wait a minute and try again. Otherwise, check your internet connection.");
  if (!e.status) return e.message;
  return T("Erro ao calcular o percurso: ", "Routing failed: ") + (e.message || "unknown error");
}

/* ---------- rendering ---------- */
// Each option is named after the thing it does best among the current set.
function optionNames() {
  const names = candidates.map(() => null), used = new Set();
  const traits = [
    [["Melhor", "Best match"], c => -c.s.penalty],
    [["Mais verde", "Greenest"], c => c.m.sceneShare ?? -1],
    [["Mais PR/GR", "Most PR/GR"], c => c.m.officialShare ?? -1],
    [["Mais plano", "Flattest"], c => -c.s.perKm],
    [["Mais subidas", "Hilliest"], c => c.s.perKm],
    [["Mais calmo", "Quietest"], c => -c.m.busyShare],
    [["Mais iluminado", "Best lit"], c => c.m.roadside && c.o.night ? c.m.roadside.litM / c.m.roadside.totalM : -1]
  ];
  traits.forEach(([pair, f], t) => {
    if (candidates.length < 2 && t > 0) return;
    const name = TT(pair);
    let best = -1, bv = -Infinity;
    candidates.forEach((c, i) => { const v = f(c); if (names[i] == null && v > bv) { bv = v; best = i; } });
    if (best >= 0 && bv !== -1 && !used.has(name)) { names[best] = name; used.add(name); }
  });
  return names.map((n, i) => n || T(`Opção ${i + 1}`, `Option ${i + 1}`));
}

// The route options are tabs above the ticket
function renderOptions() {
  const box = $("options");
  box.innerHTML = "";
  box.hidden = candidates.length < 2;
  if (box.hidden) return;
  const names = optionNames();
  candidates.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.id = "opt-" + i;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(i === selected));
    b.innerHTML = `<span class="opt-name"><i class="dot ${c.s.fits ? "good" : "warn"}"></i><b></b></span><span class="opt-stats">${fmtKm(c.m.distance)} km · ${Math.round(c.m.ascent)} m</span>`;
    b.querySelector("b").textContent = names[i] + (c.history && c.history.length ? T(" (editado)", " (edited)") : "");
    b.title = c.s.fits ? T("Cumpre tudo o que pediste", "Fits everything you asked for") : c.s.issues.join(" · ");
    b.addEventListener("click", () => select(i, false));
    box.appendChild(b);
  });
}

function hasRoute() { return selected >= 0 && !!candidates[selected] && !!candidates[selected].m; }

// Room the floating cards take, so a route is fitted into the part of the map you can see
function fitOpts() {
  const vw = innerWidth, vh = innerHeight, tl = [30, 30], br = [30, 30];
  const head = document.querySelector(".top").getBoundingClientRect();
  tl[1] = Math.max(tl[1], head.bottom + 12);
  const els = ["result", "plan", "more", "draw-card", "mymap-panel"].map($).filter(el => !el.hidden);
  const nav = document.querySelector(".tabs").getBoundingClientRect();
  if (nav.top > vh * 0.8) br[1] = Math.max(br[1], vh - nav.top + 20);
  for (const el of els) {
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) continue;
    if (r.width < vw * 0.55) tl[0] = Math.max(tl[0], r.right + 24);          // a card down the left side
    else if (vh - r.bottom < vh * 0.15) br[1] = Math.max(br[1], vh - r.top + 20);   // a bottom sheet
    else tl[1] = Math.max(tl[1], r.bottom + 12);                              // a card along the top
  }
  return { paddingTopLeft: tl, paddingBottomRight: br };
}

function select(i, fit) {
  selected = i;
  if (!candidates[i] || !candidates[i].m) return;
  document.querySelectorAll(".opt").forEach((el, k) => el.setAttribute("aria-selected", String(k === i)));
  routeLayer.clearLayers();
  const col = lineColors(), routeColor = col.route, altColor = col.alt;

  candidates.forEach((c, k) => {
    if (k === i || !c.m) return;
    L.polyline(c.m.pts.map(p => [p[0], p[1]]), { color: altColor, weight: 3, opacity: activeBase === "sat" ? .85 : .55, dashArray: "4 6" })
      .on("click", () => select(k, false)).addTo(routeLayer);
  });
  const c = candidates[i];
  const line = c.m.pts.map(p => [p[0], p[1]]);
  L.polyline(line, { color: col.casing, weight: 12, opacity: 1, lineCap: "round", lineJoin: "round", interactive: false }).addTo(routeLayer);
  const classed = colorBy !== "plain" ? colorClasses(c.m, colorBy) : null;
  if (classed) drawClassed(line, classed.cls, RAMPS[colorBy], routeColor);
  else L.polyline(line, { color: routeColor, weight: 6, lineCap: "round", lineJoin: "round", interactive: false }).addTo(routeLayer);
  const ro = view === "mine";        // a workout being looked at: no editing until you press Editar
  if (ro) L.circleMarker(line[0], { radius: 7, color: col.route, weight: 4, fillColor: css("--start"), fillOpacity: 1, interactive: false }).addTo(routeLayer);
  // a wide, invisible line on top makes the route easy to grab
  if (!ro) {
    const hit = L.polyline(line, { color: routeColor, weight: 20, opacity: 0, className: "route-hit", bubblingMouseEvents: false })
      .bindTooltip(T("Arrasta para mudar", "Drag to reshape"), { sticky: true }).addTo(routeLayer);
    hit.on("mousedown", e => startLineDrag(c, e));
    hit.on("click", e => { if (Date.now() < suppressClickUntil) return; addPointAt(c, e.latlng); });
  }
  if (c.m.roadside) for (const run of c.m.roadside.runs) {
    const seg = c.m.pts.slice(run.from, run.to + 1).map(p => [p[0], p[1]]);
    const isDark = run.type === "unlit";
    if (isDark && !c.o.night) continue;
    L.polyline(seg, { color: isDark ? col.unlit : col.warn, weight: 7, opacity: .9, dashArray: isDark ? "2 8" : null, lineCap: "round" })
      .bindTooltip(isDark ? T("Troço sem luz", "Unlit stretch") : T("Sem passeio", "No sidewalk")).addTo(routeLayer);
  }
  drawStops(c);
  const pts = ro ? [] : editPoints(c);
  pts.forEach((p, n) => {
    const icon = L.divIcon({ className: "wp-icon edit", html: String(n + 1), iconSize: [22, 22] });
    const mk = L.marker([p.lat, p.lon], { icon, draggable: !editBusy, keyboard: true, title: p.name ? `${p.name} (${T("arrasta para mover", "drag to move")})` : T("Arrasta para mover", "Drag to move") }).addTo(routeLayer);
    mk.on("dragend", e => {
      const ll = e.target.getLatLng();
      reroute(c, pts.map((q, k) => k === n ? { lat: ll.lat, lon: ll.lng } : q));
    });
    mk.on("contextmenu", ev => {
      if (ev.originalEvent) L.DomEvent.preventDefault(ev.originalEvent);
      if (pts.length <= 1 && !c.manual) return setStatus(T("Uma volta precisa de pelo menos um ponto além da partida.", "A loop needs at least one point besides the start."), true);
      reroute(c, pts.filter((_, k) => k !== n));
    });
  });
  $("undo").hidden = !(c.history && c.history.length);
  layout();
  renderStrip(c);
  if (fit) map.fitBounds(L.latLngBounds(line), fitOpts());
}

function renderStrip(c) {
  const m = c.m, cell = (label, value, unit) => `<div class="stat"><dt>${label}</dt><dd>${value}<small>${unit}</small></dd></div>`;
  const pct = x => (x * 100).toFixed(0);
  const via = [...new Set(editPoints(c).map(p => p.name).filter(n => n && !/^(woods|park|water|viewpoint|peak|trail)$/.test(n)))];
  let kind = c.o.loop === false ? T("Só ida", "One way") : T("Ida e volta", "Round trip");
  let viaText = via.length ? T("por ", "via ") + via.slice(0, 2).join(", ") : (c.o.official ? T("por trilhos PR/GR", "on PR/GR trails") : T("percurso aleatório", "random loop"));
  if (c.manual && !c.workout) viaText = T(`${c.points.length} ${c.points.length === 1 ? "ponto teu" : "pontos teus"}`, `${c.points.length} ${c.points.length === 1 ? "point" : "points"} of yours`);
  const wk = c.workout && !(c.history && c.history.length) ? c.workout : null;
  if (wk) { kind = wk.sport && SPORTS[wk.sport] ? TT(SPORTS[wk.sport]) : T("Treino", "Workout"); viaText = (wk.date || "") + (wk.name && !/^route /i.test(wk.name) ? " · " + wk.name : ""); }
  $("t-sub").textContent = wk ? `${kind} · ${viaText}` : `${TT(ACT_NAMES[ACTIVITY_OF[c.o.profile]] || ACT_NAMES.walk)} · ${kind} · ${viaText}`;
  $("t-dist").innerHTML = `${fmtKm(m.distance)}<small>km</small>`;
  let h = 7; for (const p of m.pts.filter((_, i) => i % 25 === 0)) h = (h * 31 + Math.round(p[0] * 1e4) + Math.round(p[1] * 1e4)) % 99991;
  $("t-no").textContent = `Nº ${String(h).padStart(5, "0")}`;
  const ws = (wk && wk.stats) || {};
  $("stats-main").innerHTML =
    cell(T("Subida", "Climb"), Math.round(m.ascent), "m") +
    cell(T("Tempo", "Time"), fmtTime(m.duration), "") +
    (ws.hrAvg ? cell(T("Pulsação média", "Avg heart rate"), "♥" + ws.hrAvg, "bpm")
      : c.o.shade && m.shadeShare != null ? cell(T("À sombra", "In shade"), pct(m.shadeShare), "%")
      : m.sceneShare != null ? cell(T("Verde", "Green"), pct(m.sceneShare), "%") : cell(T("Inclinação", "Steepest"), m.maxGrade.toFixed(0), "%"));
  const rs = m.roadside;
  const wkCells =
    (ws.hrMax ? cell(T("Pulsação máx.", "Max heart rate"), ws.hrMax, "bpm") : "") +
    (ws.hrMin ? cell(T("Pulsação mín.", "Min heart rate"), ws.hrMin, "bpm") : "") +
    (ws.kcal ? cell(T("Calorias ativas", "Active calories"), ws.kcal, "kcal") : "") +
    (ws.cad ? cell(T("Cadência", "Cadence"), ws.cad, wk.sport === "bike" ? "rpm" : "spm") : "") +
    (ws.power ? cell(T("Potência", "Power"), ws.power, "W") : "") +
    (ws.temp != null && ws.temp !== undefined ? cell(T("Temperatura", "Temperature"), ws.temp, "°C") : "") +
    (wk && wk.dur && m.distance ? (wk.sport === "bike" || ACTIVITY_OF[c.o.profile] === "bike" || ACTIVITY_OF[c.o.profile] === "mtb"
      ? cell(T("Velocidade média", "Avg speed"), (m.distance / 1000 / (wk.dur / 3600)).toFixed(1), "km/h")
      : cell(T("Ritmo", "Pace"), fmtPace(wk.dur / (m.distance / 1000)), "/km")) : "");
  $("stats").innerHTML = wk ? wkCells + cell(T("Inclinação máx.", "Steepest"), m.maxGrade.toFixed(0), "%") : wkCells +
    (m.sceneShare != null ? cell(T("Inclinação máx.", "Steepest"), m.maxGrade.toFixed(0), "%") : "") +
    cell(T("Estradas principais", "Main roads"), pct(m.busyShare), "%") +
    (m.shadeShare != null && !c.o.shade ? cell(T("À sombra", "In shade"), pct(m.shadeShare), "%") : "") +
    (m.shadeShare != null && c.o.shade && m.sceneShare != null ? cell(T("Verde", "Green"), pct(m.sceneShare), "%") : "") +
    (m.forestShare != null ? cell(T("Dentro de matas", "Inside woods"), pct(m.forestShare), "%") : "") +
    (m.officialShare != null ? cell("PR/GR", pct(m.officialShare), "%") : "") +
    (m.newShare != null && !c.workout ? cell(T("Novo para ti", "New to you"), pct(m.newShare), "%") : "") +
    (rs && c.o.sidewalks ? cell(T("Com passeio", "Sidewalk"), rs.roadM ? pct(rs.yesSidewalkM / rs.roadM) : "–", rs.roadM ? "%" : "") : "") +
    (rs && c.o.night ? cell(T("Iluminado", "Lit"), pct(rs.litM / rs.totalM), "%") : "");
  const issues = c.manual ? [] : c.s.issues;
  if (wk && !ws.hrAvg) {
    $("t-issues").hidden = false;
    $("t-issues").textContent = T("Este treino não tem pulsação: os GPX do Apple Watch só trazem o trajeto. Em O meu mapa › Importar treinos, escolhe o ficheiro exportar.zip inteiro e os treinos que já tens ganham pulsação e calorias.",
      "This workout has no heart rate: Apple Watch GPX files only carry the track. In My map › Import workouts, pick the whole export.zip and the workouts you already have get heart rate and calories.");
  } else {
  $("t-issues").hidden = !issues.length;
  $("t-issues").textContent = issues.length ? T("Fica aquém: ", "Falls short: ") + issues.join(" · ") : "";
  }
  const notes = [wk ? T(`${c.s.perKm.toFixed(0)} m de subida por km. Tempo real do treino.`, `${c.s.perKm.toFixed(0)} m of climb per km. Time is the workout's real time.`)
    : T(`${c.s.perKm.toFixed(0)} m de subida por km. O tempo é uma estimativa do serviço de rotas.`, `${c.s.perKm.toFixed(0)} m of climb per km. Time is the routing service's estimate.`)];
  if (wk && m.hr) notes.push(T("A linha vermelha no gráfico é a pulsação.", "The red line on the chart is heart rate."));
  if (rs && c.o.sidewalks && rs.roadM) notes.push(T(`A percentagem com passeio conta os ${fmtKm(rs.roadM)} km em estrada; ${pct(rs.unknownSidewalkM / rs.roadM)}% disso não está mapeado.`, `Sidewalk % covers the ${fmtKm(rs.roadM)} km on roads; ${pct(rs.unknownSidewalkM / rs.roadM)}% of that isn't mapped either way.`));
  if (c.o.fireLevel && !wk) notes.push(c.o.noForest ? fireNotice() : T(`Risco de incêndio hoje aqui: ${TT(FIRE_NAMES[c.o.fireLevel])} (IPMA).`, `Fire risk here today: ${TT(FIRE_NAMES[c.o.fireLevel])} (IPMA).`));
  if (rs && c.o.night && rs.unknownLightM) notes.push(T(`${pct(rs.unknownLightM / rs.totalM)}% não tem informação de iluminação no mapa.`, `${pct(rs.unknownLightM / rs.totalM)}% has no lighting info on the map.`));
  if (!rs && !wk && (c.o.sidewalks || c.o.night)) notes.push(T("Passeios e iluminação não foram verificados neste percurso.", "Sidewalks and lighting weren't checked for this route."));
  $("strip-note").textContent = notes.join(" ");
  $("stats").closest("details").open = !!wkCells;   // a workout's heart rate and calories are worth showing straight away
  renderMix(m);
  renderColorBy(c);
  renderSurface(m);
  renderStops(c);
  drawChart(m);
}

function niceStep(range, target) {
  const raw = range / target, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

// Elevation, and for a workout with heart rate a second panel under it on its own scale (never two y-axes on one chart).
// Hovering (or dragging a finger) moves a crosshair across both, marks the spot on the map, and reads the values out below.
function drawChart(m) {
  const svg = $("chart");
  const hr = m.hr && m.hr.some(v => v != null) ? m.hr : null;
  svg.classList.toggle("with-hr", !!hr);
  const W = svg.clientWidth || 600, H = svg.clientHeight || (hr ? 140 : 72), padL = 44, padR = 8, padT = 6, padB = 18;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const gap = 10, top = padT, eleH = hr ? Math.round((H - padT - padB - gap) * 0.55) : H - padT - padB;
  const hrTop = top + eleH + gap, hrH = H - padB - hrTop;
  const els = m.pts.map(p => p[2]);
  let lo = Math.min(...els), hi = Math.max(...els);
  if (hi - lo < 20) { const mid = (hi + lo) / 2; lo = mid - 10; hi = mid + 10; }
  const yStep = niceStep(hi - lo, 2);
  lo = Math.floor(lo / yStep) * yStep; hi = Math.ceil(hi / yStep) * yStep;
  const total = m.cum[m.cum.length - 1];
  const x = d => padL + d / total * (W - padL - padR);
  const y = e => top + (1 - (e - lo) / (hi - lo)) * eleH;
  const line = m.pts.map((p, i) => `${i ? "L" : "M"}${x(m.cum[i]).toFixed(1)},${y(p[2]).toFixed(1)}`).join("");
  const routeC = lineColors().route, lineC = css("--line"), ridge = css("--moss"), ink = css("--ink");
  let g = "";
  for (let e = lo; e <= hi + 1e-6; e += yStep)
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y(e)}" y2="${y(e)}" stroke="${lineC}" stroke-width="1"/><text x="${padL - 6}" y="${y(e) + 4}" text-anchor="end">${Math.round(e)} m</text>`;
  const xStep = niceStep(total / 1000, 6);
  for (let k = 0; k <= total / 1000 + 1e-6; k += xStep)
    g += `<text x="${x(k * 1000)}" y="${H - 4}" text-anchor="middle">${+k.toFixed(1)} km</text>`;
  g += `<path d="${line}L${x(total)},${y(lo)}L${x(0)},${y(lo)}Z" fill="${ridge}" fill-opacity=".28"/>` +
    `<path d="${line}" fill="none" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>`;
  if (hr) {
    const vals = hr.filter(v => v != null);
    const hlo = Math.floor(Math.min(...vals) / 10) * 10, hhi = Math.max(hlo + 20, Math.ceil(Math.max(...vals) / 10) * 10);
    const hy = v => hrTop + (1 - (v - hlo) / (hhi - hlo)) * hrH;
    let d = "", pen = false;
    hr.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(m.cum[i]).toFixed(1)},${hy(v).toFixed(1)}`; pen = true; });
    for (const v of [hlo, hhi]) g += `<line x1="${padL}" x2="${W - padR}" y1="${hy(v)}" y2="${hy(v)}" stroke="${lineC}" stroke-width="1"/><text x="${padL - 6}" y="${hy(v) + 4}" text-anchor="end">${v}</text>`;
    g += `<text x="${padL - 6}" y="${hrTop + hrH / 2 + 4}" text-anchor="end">♥</text>` +
      `<path d="${d}" fill="none" stroke="${css("--bad")}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  svg.innerHTML = g + `<line id="cursor" y1="${top}" y2="${H - padB}" stroke="${routeC}" stroke-width="1.5" visibility="hidden"/><title></title>`;

  const read = $("chart-read");
  const idle = () => { read.textContent = T("Passa o rato ou o dedo pelo gráfico para ver cada ponto.", "Hover or drag along the chart to read each point."); };
  idle();
  const grade = gradeAlong(m);
  const at = clientX => {
    const r = svg.getBoundingClientRect();
    const px = (clientX - r.left) * (W / r.width);
    const d = Math.max(0, Math.min(total, (px - padL) / (W - padL - padR) * total));
    let i = 0; while (i < m.cum.length - 1 && m.cum[i] < d) i++;
    const cur = svg.querySelector("#cursor");
    cur.setAttribute("x1", x(m.cum[i])); cur.setAttribute("x2", x(m.cum[i])); cur.setAttribute("visibility", "visible");
    const ll = [m.pts[i][0], m.pts[i][1]];
    if (!hoverMarker) hoverMarker = L.circleMarker(ll, { radius: 7, color: lineColors().casing, weight: 3, fillColor: routeC, fillOpacity: 1 }).addTo(map);
    else hoverMarker.setLatLng(ll);
    const parts = [`${fmtKm(m.cum[i])} km`, `${Math.round(m.pts[i][2])} m`, `${grade[i] > 0 ? "+" : ""}${grade[i].toFixed(0)}%`];
    if (hr && hr[i] != null) parts.push(`♥ ${hr[i]}`);
    if (m.spd && m.spd[i] != null) parts.push(`${m.spd[i].toFixed(1)} km/h`);
    read.textContent = parts.join(" · ");
    svg.setAttribute("aria-label", parts.join(", "));
  };
  svg.onpointermove = ev => at(ev.clientX);
  svg.onpointerdown = ev => at(ev.clientX);
  svg.onpointerleave = () => {
    svg.querySelector("#cursor")?.setAttribute("visibility", "hidden");
    if (hoverMarker) { map.removeLayer(hoverMarker); hoverMarker = null; }
    idle();
  };
}

// slope at each point, over about 50 m either side
function gradeAlong(m) {
  if (m._grade) return m._grade;
  const out = new Array(m.pts.length).fill(0);
  for (let i = 0, a = 0, b = 0; i < m.pts.length; i++) {
    while (a < i && m.cum[i] - m.cum[a] > 50) a++;
    while (b < m.pts.length - 1 && m.cum[b] - m.cum[i] < 50) b++;
    const run = m.cum[b] - m.cum[a];
    out[i] = run > 20 ? (m.pts[b][2] - m.pts[a][2]) / run * 100 : 0;
  }
  return m._grade = out;
}

window.addEventListener("resize", () => { if (selected >= 0) drawChart(candidates[selected].m); });

/* ---------- road-type breakdown ---------- */
const WAYTYPES = {
  1: [["Estrada principal", "Main road"], "--mix-main"], 2: [["Estrada", "Road"], "--mix-road"], 3: [["Rua", "Street"], "--mix-street"], 4: [["Caminho", "Path"], "--mix-path"],
  5: [["Estradão", "Track"], "--mix-track"], 6: [["Ciclovia", "Cycleway"], "--mix-cycle"], 7: [["Passeio pedonal", "Footway"], "--mix-foot"], 8: [["Escadas", "Steps"], "--mix-steps"],
  9: [["Ferry", "Ferry"], "--mix-other"], 10: [["Em obras", "Under construction"], "--mix-other"], 0: [["Desconhecido", "Unknown"], "--mix-other"]
};
const wtName = t => TT((WAYTYPES[t] || WAYTYPES[0])[0]);

/* ---------- what's underfoot: ORS surface codes grouped the way a rider or walker thinks of them ---------- */
// 1 paved, 3 asphalt, 4 concrete, 6 metal, 7 wood | 14 paving stones (and the old 5 cobblestone): calçada, empedrado |
// 2 unpaved, 8 compacted gravel, 9 fine gravel, 10 gravel, 11 dirt, 12 ground, 13 ice, 15 sand, 16 woodchips, 17 grass, 18 grass paver | 0 unknown
const SURF_GROUP = { 1: "paved", 3: "paved", 4: "paved", 6: "paved", 7: "paved", 5: "stones", 14: "stones" };
const SURF = {
  paved: [["Alcatrão e cimento", "Asphalt and concrete"], "--mix-street"],
  stones: [["Calçada e empedrado", "Cobbles and setts"], "--mix-steps"],
  unpaved: [["Terra e gravilha", "Dirt and gravel"], "--mix-track"],
  unknown: [["Sem dados", "No data"], "--mix-other"]
};
function surfaceMix(props, cum, total) {
  const sv = props.extras && props.extras.surface;
  if (!sv) return null;
  const d = { paved: 0, stones: 0, unpaved: 0, unknown: 0 };
  for (const [a, b, v] of sv.values) d[v === 0 ? "unknown" : SURF_GROUP[v] || "unpaved"] += cum[Math.min(b, cum.length - 1)] - cum[a];
  for (const k in d) d[k] /= total;
  return d;
}
/* ---------- colouring the line by gradient, heart rate or speed ---------- */
// Sequential single-hue ramps for magnitudes (heart-rate zones, speed); a diverging pair with a grey middle for gradient.
const RAMPS = {
  hr: ["#fdd5c4", "#f9a383", "#ef6b4b", "#cf3a2c", "#8f1d18"],
  speed: ["#d3e5fb", "#9cc3f2", "#5e98e0", "#2d6bc2", "#16408a"],
  grade: ["#1f5fa8", "#79a8d8", "#b9bfbb", "#f0a46a", "#c8501c"]
};
let colorBy = "plain";
function maxHr() {
  const set = Number(store.get("hr-max"));
  if (set >= 120 && set <= 230) return set;
  const seen = workouts.map(w => w.stats && w.stats.hrMax).filter(v => v > 100 && v < 230);
  return seen.length ? Math.max(...seen) : 190;
}
const zoneOf = (v, mx) => { const f = v / mx; return f < .6 ? 0 : f < .7 ? 1 : f < .8 ? 2 : f < .9 ? 3 : 4; };
function colorClasses(m, mode) {
  if (mode === "hr" && m.hr) {
    const mx = maxHr(), b = [.6, .7, .8, .9].map(f => Math.round(f * mx));
    return { cls: m.hr.map(v => v == null ? null : zoneOf(v, mx)),
      labels: [`Z1 <${b[0]}`, `Z2 ${b[0]}–${b[1]}`, `Z3 ${b[1]}–${b[2]}`, `Z4 ${b[2]}–${b[3]}`, `Z5 ≥${b[3]}`], unit: "bpm" };
  }
  if (mode === "speed" && m.spd) {
    const v = m.spd.filter(x => x != null).sort((a, b) => a - b);
    if (v.length < 10) return null;
    const q = [.2, .4, .6, .8].map(f => v[Math.floor(f * (v.length - 1))]);
    const f1 = x => x.toFixed(1);
    return { cls: m.spd.map(x => x == null ? null : x < q[0] ? 0 : x < q[1] ? 1 : x < q[2] ? 2 : x < q[3] ? 3 : 4),
      labels: [`<${f1(q[0])}`, `${f1(q[0])}–${f1(q[1])}`, `${f1(q[1])}–${f1(q[2])}`, `${f1(q[2])}–${f1(q[3])}`, `≥${f1(q[3])}`], unit: "km/h" };
  }
  if (mode === "grade") {
    const g = gradeAlong(m);
    return { cls: g.map(x => x < -8 ? 0 : x < -3 ? 1 : x <= 3 ? 2 : x <= 8 ? 3 : 4),
      labels: [T("descida >8%", "down >8%"), T("descida 3–8%", "down 3–8%"), T("plano", "level"), T("subida 3–8%", "up 3–8%"), T("subida >8%", "up >8%")], unit: "" };
  }
  return null;
}
function drawClassed(line, cls, ramp, fallback) {
  let from = 0;
  for (let i = 1; i <= line.length; i++) {
    if (i < line.length && cls[i] === cls[from]) continue;
    const seg = line.slice(from, Math.min(i + 1, line.length));
    if (seg.length > 1) L.polyline(seg, { color: cls[from] == null ? fallback : ramp[cls[from]], weight: 6, lineCap: "round", lineJoin: "round", interactive: false }).addTo(routeLayer);
    from = i;
  }
}
function renderColorBy(c) {
  const m = c.m;
  $("cb-hr").disabled = !m.hr; $("cb-hr-l").hidden = !m.hr;
  $("cb-speed").disabled = !m.spd; $("cb-speed-l").hidden = !m.spd;
  if ((colorBy === "hr" && !m.hr) || (colorBy === "speed" && !m.spd)) { colorBy = "plain"; }
  $("cb-" + colorBy).checked = true;
  const box = $("ramp-legend"), cc = colorBy !== "plain" ? colorClasses(m, colorBy) : null;
  box.hidden = !cc;
  if (!cc) return;
  box.innerHTML = cc.labels.map((l, k) => `<span><i style="background:${RAMPS[colorBy][k]}"></i>${l}</span>`).join("") + (cc.unit ? `<span>${cc.unit}</span>` : "");
}
document.querySelectorAll("input[name=colorby]").forEach(i => i.addEventListener("change", () => { colorBy = i.value; if (hasRoute()) select(selected, false); }));

// speed along a workout, from the time stamps, smoothed over a few points
function speedAlong(m, pts) {
  if (!pts.some(p => p[4] != null)) return null;
  const out = pts.map((_, i) => {
    const a = Math.max(0, i - 3), b = Math.min(pts.length - 1, i + 3);
    if (pts[a][4] == null || pts[b][4] == null) return null;
    const dt = pts[b][4] - pts[a][4], dd = m.cum[b] - m.cum[a];
    return dt > 0 ? Math.min(80, dd / dt * 3.6) : null;
  });
  return out.some(v => v != null) ? out : null;
}

/* ---------- stops along the way: water, cafés, toilets, viewpoints, trailheads (OpenStreetMap) ---------- */
const STOPS = {
  water: { q: 'node["amenity"="drinking_water"]', icon: "💧", name: ["Água potável", "Drinking water"], many: ["Água potável", "Drinking water"] },
  cafe: { q: 'node["amenity"~"^(cafe|bar|restaurant)$"]', icon: "☕", name: ["Café", "Café"], many: ["Cafés", "Cafés"] },
  toilets: { q: 'node["amenity"="toilets"]', icon: "🚻", name: ["WC", "Toilet"], many: ["WC", "Toilets"] },
  view: { q: 'node["tourism"="viewpoint"]', icon: "🏞️", name: ["Miradouro", "Viewpoint"], many: ["Miradouros", "Viewpoints"] },
  trailhead: { q: 'node["highway"="trailhead"]', icon: "🥾", name: ["Início de trilho", "Trailhead"], many: ["Inícios de trilho", "Trailheads"] }
};
const STOP_NEAR = 60;   // metres from the line
let stopsData = null;   // { bbox: [s, w, n, e], list: [{lat, lon, kind, name}] }
async function ensureStops(bb) {
  const c = stopsData && stopsData.bbox;
  if (c && bb[0] >= c[0] && bb[1] >= c[1] && bb[2] <= c[2] && bb[3] <= c[3]) return stopsData;
  const pad = 0.01, box = [bb[0] - pad, bb[1] - pad, bb[2] + pad, bb[3] + pad];
  const b = box.map(v => v.toFixed(5)).join(",");
  const q = `[out:json][timeout:25];(${Object.values(STOPS).map(k => `${k.q}(${b});`).join("")});out body qt;`;
  const res = await overpass(q);
  if (!res.ok) throw new Error("stops " + res.status);
  const data = await res.json();
  const kindOf = t => t.amenity === "drinking_water" ? "water" : /^(cafe|bar|restaurant)$/.test(t.amenity || "") ? "cafe" : t.amenity === "toilets" ? "toilets" : t.tourism === "viewpoint" ? "view" : t.highway === "trailhead" ? "trailhead" : null;
  stopsData = { bbox: box, list: (data.elements || []).map(e => ({ lat: e.lat, lon: e.lon, kind: kindOf(e.tags || {}), name: (e.tags || {}).name || "" })).filter(x => x.kind && Number.isFinite(x.lat)) };
  return stopsData;
}
function stopsAlong(m) {
  if (!stopsData) return null;
  const G = 0.001, grid = new Map();       // route samples every ~25 m in a ~100 m grid
  for (let d = 0, i = 0, total = m.cum[m.cum.length - 1]; d <= total; d += 25) {
    while (i < m.cum.length - 1 && m.cum[i + 1] < d) i++;
    const k = `${Math.floor(m.pts[i][0] / G)},${Math.floor(m.pts[i][1] / G)}`;
    let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(m.pts[i]);
  }
  return stopsData.list.filter(st => {
    const ci = Math.floor(st.lat / G), cj = Math.floor(st.lon / G);
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
      const a = grid.get(`${ci + di},${cj + dj}`);
      if (a && a.some(p => haversine(p, [st.lat, st.lon]) <= STOP_NEAR)) return true;
    }
    return false;
  });
}
async function refreshStops() {
  const routes = candidates.filter(c => c.m && !c.workout);
  if (!routes.length) return;
  const all = routes.flatMap(c => c.m.pts);
  const bb = [Math.min(...all.map(p => p[0])), Math.min(...all.map(p => p[1])), Math.max(...all.map(p => p[0])), Math.max(...all.map(p => p[1]))];
  try { await ensureStops(bb); } catch { return; }
  let changed = false;
  for (const c of routes) { const st = stopsAlong(c.m); if (st) { c.m.stops = st; changed = true; } }
  if (changed && hasRoute() && candidates[selected].m.stops) select(selected, false);
}
function renderStops(c) {
  const box = $("stops"), st = c.m.stops;
  box.hidden = !st;
  if (!st) return;
  const counts = Object.keys(STOPS).map(k => [k, st.filter(x => x.kind === k).length]).filter(x => x[1]);
  box.innerHTML = counts.length ? "" : `<span class="hint">${T("Sem água, cafés nem WC mapeados junto ao percurso.", "No water, cafés or toilets mapped along the route.")}</span>`;
  for (const [k, n] of counts) {
    const s = document.createElement("span");
    s.className = "stop-chip"; s.textContent = `${STOPS[k].icon} ${n} ${TT(n === 1 ? STOPS[k].name : STOPS[k].many)}`;
    box.appendChild(s);
  }
}
function drawStops(c) {
  if (!c.m.stops) return;
  const shown = {};
  for (const st of c.m.stops) {
    shown[st.kind] = (shown[st.kind] || 0) + 1;
    if (st.kind === "cafe" && shown.cafe > 12) continue;     // a town centre has dozens; a dozen is plenty on the map
    L.marker([st.lat, st.lon], { icon: L.divIcon({ className: "stop-icon", html: STOPS[st.kind].icon, iconSize: [24, 24] }), keyboard: false, interactive: true })
      .bindTooltip(st.name ? `${st.name} · ${TT(STOPS[st.kind].name)}` : TT(STOPS[st.kind].name)).addTo(routeLayer);
  }
}

function renderSurface(m) {
  const box = $("surface"), su = m.surface;
  if (!su) { box.innerHTML = ""; return; }
  const parts = Object.keys(SURF).filter(k => su[k] > 0.005).map(k => ({ k, share: su[k] }));

    parts.map(x => `<span style="width:${(x.share * 100).toFixed(2)}%;background:var(${SURF[x.k][1]})" title="${TT(SURF[x.k][0])} ${pct(x)}%"></span>`).join("") +
    `</div><div class="mix-legend"><b>${T("Piso", "Surface")}</b>` +

}
function renderMix(m) {

    m.wayMix.map(x => `<span style="width:${(x.share * 100).toFixed(2)}%;background:var(${(WAYTYPES[x.type] || WAYTYPES[0])[1]})" title="${wtName(x.type)} ${pct(x)}%"></span>`).join("") +
    `</div><div class="mix-legend"><b>${T("Vias", "Ways")}</b>` +
    m.wayMix.map(x => `<span><i style="background:var(${(WAYTYPES[x.type] || WAYTYPES[0])[1]})"></i>${wtName(x.type)} ${pct(x)}%</span>`).join("") +
    `</div>`;
}

/* ---------- reshaping a route by hand ---------- */
let editCtx = null;     // scenery and official trails from the last Generate, reused when re-measuring
let editBusy = false;

// The points a route passes through. Scenic and trail waypoints are used as they are;
// a round trip gets evenly spaced points taken from its own line.
function editPoints(c) {
  if (c.points) return c.points;
  if (c.wps && c.wps.length) return c.points = c.wps.map(w => ({ lat: w.lat, lon: w.lon, name: w.name || w.type }));
  const total = c.m.cum[c.m.cum.length - 1];
  const n = Math.max(3, Math.min(8, Math.round(total / 1500)));
  const out = [];
  for (let k = 1; k <= n; k++) { const i = idxAt(c.m.cum, total * k / (n + 1)); out.push({ lat: c.m.pts[i][0], lon: c.m.pts[i][1] }); }
  return c.points = out;
}

function nearestIdx(m, lat, lon) {
  const kx = Math.cos(rad(lat));
  let best = 0, bd = Infinity;
  for (let i = 0; i < m.pts.length; i++) {
    const d = (m.pts[i][0] - lat) ** 2 + ((m.pts[i][1] - lon) * kx) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// Where a new point grabbed on the line goes in the list: after every point the route reaches before it.
function insertIndex(c, ll) {
  const d = c.m.cum[nearestIdx(c.m, ll.lat, ll.lng)];
  return editPoints(c).filter(p => c.m.cum[nearestIdx(c.m, p.lat, p.lon)] < d).length;
}

function addPointAt(c, ll) {
  if (editBusy) return;
  const pts = editPoints(c).slice();
  pts.splice(insertIndex(c, ll), 0, { lat: ll.lat, lon: ll.lng });
  reroute(c, pts);
}

const ghostIcon = L.divIcon({ className: "ghost-icon", iconSize: [14, 14] });
function startLineDrag(c, e) {
  if (editBusy) return;
  if (e.originalEvent) L.DomEvent.preventDefault(e.originalEvent);
  map.dragging.disable();
  const from = e.latlng;
  const ghost = L.marker(from, { icon: ghostIcon, interactive: false }).addTo(routeLayer);
  let moved = false;
  const move = ev => { ghost.setLatLng(ev.latlng); if (map.distance(ev.latlng, from) > 3) moved = true; };
  const up = () => {
    map.off("mousemove", move);
    document.removeEventListener("mouseup", up);
    map.dragging.enable();
    suppressClickUntil = Date.now() + 400;
    if (!moved) { routeLayer.removeLayer(ghost); return addPointAt(c, from); }
    const ll = ghost.getLatLng();
    const pts = editPoints(c).slice();
    pts.splice(insertIndex(c, from), 0, { lat: ll.lat, lon: ll.lng });
    reroute(c, pts);
  };
  map.on("mousemove", move);
  document.addEventListener("mouseup", up);
}

function editWarnings(m, o) {
  const w = [];
  if (m.spurs || m.detours) w.push(T("volta para trás sobre si mesmo", "it now doubles back on itself"));
  if (m.unsafeRoad) w.push(T("segue uma estrada principal", "it follows a main road"));
  const rs = m.roadside;
  if (rs && o.sidewalks && rs.longestNoSidewalk > 200) w.push(T("tem um troço longo sem passeio", "a long stretch has no sidewalk"));
  if (rs && o.sidewalks && rs.longestRoundabout > 40) w.push(T("dá a volta a uma rotunda", "it goes around a roundabout"));
  if (rs && o.night && rs.longestDark > 150) w.push(T("parte dele não tem luz", "part of it is unlit"));
  if (o.noForest && m.forestShare > 0.2) w.push(T("passa por matas num dia de risco de incêndio", "it goes through woods on a high fire-risk day"));
  return w;
}

function showEditResult(c) {
  const w = editWarnings(c.m, c.o);
  if (w.length) setStatus(T(`Percurso atualizado, mas ${w.join(" e ")}. Move um ponto ou carrega em Desfazer.`, `Route updated, but ${w.join(" and ")}. Move a point or press Undo.`), true);
  else setStatus(T(`Percurso atualizado: ${fmtKm(c.m.distance)} km.`, `Route updated: ${fmtKm(c.m.distance)} km.`));
}

async function reroute(c, newPoints, newStart) {
  if (editBusy) return;
  if (!newPoints.length) {                      // a hand-drawn route with every point removed
    if (newStart) setStart(L.latLng(newStart[0], newStart[1]), false);
    if (c.manual) { if (c.m) (c.history = c.history || []).push({ points: c.points, m: c.m, s: c.s, start: c.o.start }); c.points = []; c.m = null; showEmptyTicket(); }
    return;
  }
  if (!hasRouting()) { if (startMarker && c.o.start) startMarker.setLatLng(c.o.start); return openSettings(T("Primeiro cola a tua chave do OpenRouteService.", "Add your OpenRouteService key first.")); }
  editBusy = true;
  setStatus(T("A atualizar o percurso…", "Updating route…"));
  const prev = { points: c.points, m: c.m, s: c.s, start: c.o.start };
  try {
    const o = c.o, s0 = newStart || o.start;
    const all = [s0, ...newPoints.map(p => [p.lat, p.lon])];
    if (o.loop !== false) all.push(s0);
    const body = baseBody(o);
    body.coordinates = all.map(p => [p[1], p[0]]);
    body.radiuses = all.map(() => 300);
    const fc = await route(o.profile, body);
    const f = fc.features && fc.features[0];
    if (!f) throw new Error(T("Não há percurso por esses pontos.", "No route found through those points."));
    const m = analyse(f, o, editCtx && editCtx.scenery, editCtx && editCtx.official);
    (c.history = c.history || []).push(prev);
    if (newStart) { o.start = s0; setStart(L.latLng(s0[0], s0[1]), false); }
    if (o.manual) o.length = m.distance;          // no target distance when you draw your own
    c.points = newPoints; c.m = m; c.s = score(m, o);
    editBusy = false;
    renderOptions(); select(selected, false);
    showEditResult(c);
    refreshStops();
    // sidewalks and lighting are checked in the background, then the warnings refresh
    if (o.sidewalks || o.night) {
      loadWaysAlong([sampleLine(m, 60)]).then(index => {
        if (c.m !== m) return;
        m.roadside = roadsideCheck(m, index);
        c.s = score(m, o);
        renderOptions(); select(selected, false);
        showEditResult(c);
      }).catch(() => {});
    }
  } catch (e) {
    editBusy = false;
    if (newStart && prev.start) setStart(L.latLng(prev.start[0], prev.start[1]), false);
    setStatus(e.code === 2010 ? T("Não há caminho perto desse sítio. Põe o ponto mais perto de uma estrada ou trilho.", "No path found near that spot. Drop the point closer to a road or trail.") : explain(e), true);
    if (c.m) select(selected, false); else showEmptyTicket();   // puts the points back where they were
  }
}

$("draw-undo").addEventListener("click", () => $("undo").click());
$("undo").addEventListener("click", () => {
  const c = candidates[selected];
  if (!c || !c.history || !c.history.length || editBusy) return;
  const prev = c.history.pop();
  c.points = prev.points; c.m = prev.m; c.s = prev.s;
  if (prev.start && prev.start !== c.o.start) { c.o.start = prev.start; setStart(L.latLng(prev.start[0], prev.start[1]), false); }
  if (!c.m) { c.points = c.points || []; showEmptyTicket(); return setStatus(T("Alteração desfeita.", "Edit undone.")); }
  renderOptions(); select(selected, false);
  setStatus(T("Alteração desfeita.", "Edit undone."));
});

let manual = null;
const drawMode = () => view === "draw";

function readOptions() {
  const activity = val("activity");
  const o = {
    start, profile: PROFILES[activity], terrain: val("terrain"),
    length: Number($("dist").value) * 1000, scenic: $("scenic").checked, quiet: $("quiet").checked,
    official: false, night: $("night").checked,
    fresh: !!visitedGrid && $("wk-fresh").checked
  };
  Object.assign(o, dayOptions());
  o.sidewalks = o.profile.startsWith("foot");
  return o;
}

function manualCandidate() {
  if (manual && candidates[0] === manual) return manual;
  const o = readOptions();
  o.manual = true; o.loop = loopOn();
  manual = { o, points: [], wps: [], m: null, s: null, history: [], manual: true };
  candidates = [manual]; selected = 0; routesOf = "draw";
  $("options").innerHTML = ""; $("notice").innerHTML = "";
  return manual;
}

function addManualPoint(ll) {
  if (editBusy) return;
