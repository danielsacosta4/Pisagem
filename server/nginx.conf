# One address for everything: the page, routes, map data and search.
server {
    listen 80;
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript;

    location / {
        root /usr/share/nginx/html;
        index pisagem.html;
    }
    location /ors/ {
        proxy_pass http://ors:8082/ors/;
        proxy_read_timeout 120s;
    }
    location /overpass/ {
        proxy_pass http://overpass:80/api/;
        proxy_read_timeout 120s;
    }
    location /photon/ {
        proxy_pass http://photon:2322/;
    }
}
