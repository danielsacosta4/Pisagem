/* ---------- my workouts: import from Apple Health, Garmin, Strava… ---------- */
// A workout: {name, date, dist (m), dur (s), sport, pts: [[lat, lon, ele, hr?]], stats: {hrAvg, hrMax, hrMin, kcal, cad, power, temp}}
// Apple's workout-routes GPX files hold only the track. Heart rate, calories and the rest live in export.xml,
// so the whole export.zip (or export.xml next to the GPX files) is what brings them in.
let workouts = [];
let visitedGrid = null;
const VCELL = 0.0004;         // ~40 m grid for "have I been here?"

// Stored in IndexedDB: a full Apple history is far bigger than localStorage's few MB.
const IDB = {
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error("no indexedDB"));
      const r = indexedDB.open("pisagem", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
async function loadWorkouts() {
  let list = null;
  try { list = await IDB.get("workouts"); } catch {}
  if (!Array.isArray(list)) {       // first run after the move, or no IndexedDB: take what localStorage has
    try { list = JSON.parse(localStorage.getItem("workouts") || "[]"); } catch { list = []; }
    if (Array.isArray(list) && list.length) { try { await IDB.set("workouts", list); localStorage.removeItem("workouts"); } catch {} }
  }
  workouts = Array.isArray(list) ? list : [];
  workouts.forEach(w => cleanEle(w.pts));
}
async function saveWorkouts() {
  try { await IDB.set("workouts", workouts); return true; }
  catch { try { localStorage.setItem("workouts", JSON.stringify(workouts)); return true; } catch { return false; } }
}

const SPORTS = {
  walk: ["Caminhada", "Walk"], hike: ["Trilho", "Hike"], run: ["Corrida", "Run"], bike: ["Bicicleta", "Ride"], other: ["Treino", "Workout"]
};
function sportOf(type) {   // Apple HKWorkoutActivityType…, or a GPX <type>
  const t = String(type || "").toLowerCase();
  if (/hik/.test(t)) return "hike";
  if (/walk/.test(t)) return "walk";
  if (/run/.test(t)) return "run";
  if (/cycl|bik|ride/.test(t)) return "bike";
  return t ? "other" : "";
}
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

// GPS tracks often have points with no height, or a wild reading: fill the gaps from the neighbours
// and replace spikes, or the chart drops to 0 m and the steepest stretch reads 126%. Points about 15 m apart, so a 20 m jump is a glitch.
function cleanEle(pts) {
  let e = pts.map(p => Number.isFinite(p[2]) ? p[2] : null);
  const n = pts.length;
  // a run of exactly 0 m in a track that is clearly above sea level is the watch losing altitude, not the beach
  const sorted = e.filter(v => v != null).sort((a, b) => a - b), typical = sorted.length ? sorted[sorted.length >> 1] : 0;
  if (typical > 20) e = e.map(v => v === 0 ? null : v);
  const known = e.map((v, i) => v == null ? -1 : i).filter(i => i >= 0);
  if (!known.length) { pts.forEach(p => { p[2] = 0; }); return pts; }
  for (let i = 0, k = 0; i < n; i++) {
    if (e[i] != null) continue;
    while (k < known.length - 1 && known[k + 1] < i) k++;
    const a = known[k] < i ? known[k] : null, b = known.find(j => j > i);
    e[i] = a == null ? e[b] : b == null ? e[a] : e[a] + (e[b] - e[a]) * (i - a) / (b - a);
  }
  const out = e.slice();
  for (let i = 0; i < n; i++) {
    const win = e.slice(Math.max(0, i - 3), i + 4).sort((x, y) => x - y), med = win[win.length >> 1];
    if (Math.abs(e[i] - med) > 20) out[i] = med;   // 20 m off its neighbours ~15 m away is a glitch, not a hill
  }
  pts.forEach((p, i) => { p[2] = Math.round(out[i]); });
  return pts;
}

function parseGpx(text, filename, hrSeries) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return null;
  let nodes = [...doc.getElementsByTagName("trkpt")];
  if (!nodes.length) nodes = [...doc.getElementsByTagName("rtept")];
  const raw = [], hrs = [], cads = [], pows = [], temps = [];
  for (const n of nodes) {
    const lat = parseFloat(n.getAttribute("lat")), lon = parseFloat(n.getAttribute("lon"));
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    let ele = null, time = null, hr = null;
    // Garmin/Strava/Wahoo put sensor data in extensions (gpxtpx:hr, gpxtpx:cad, gpxtpx:atemp, power), in any namespace
    for (const el of n.getElementsByTagName("*")) {
      const name = el.localName.toLowerCase(), v = parseFloat(el.textContent);
      if (name === "ele") ele = v;
      else if (name === "time") time = Date.parse(el.textContent);
      else if (!Number.isFinite(v)) continue;
      else if (name === "hr" || name === "heartrate") { hr = v; hrs.push(v); }
      else if (name === "cad" || name === "cadence") cads.push(v);
      else if (name === "power" || name === "watts") pows.push(v);
      else if (name === "atemp" || name === "temp") temps.push(v);
    }
    if (hr == null && hrSeries && Number.isFinite(time)) { hr = hrAt(hrSeries, time); if (hr != null) hrs.push(hr); }
    raw.push([lat, lon, Number.isFinite(ele) ? ele : null, Number.isFinite(time) ? time : null, hr]);
  }
  if (raw.length < 2) return null;
  let dist = 0;
  for (let i = 1; i < raw.length; i++) dist += haversine(raw[i - 1], raw[i]);
  // keep a point every 15 m or so: plenty for the map and small enough to store
  // each kept point: [lat, lon, ele, heart rate, seconds since the start]; the last two only when the file has them
  const pts = [], r5 = x => Math.round(x * 1e5) / 1e5, anyHr = hrs.length > 0, tStart = raw[0][3], anyT = Number.isFinite(tStart);
  let last = null;
  raw.forEach((p, i) => {
    if (!last || haversine(last, p) >= 15 || i === raw.length - 1) {
      const q = [r5(p[0]), r5(p[1]), p[2] == null ? null : Math.round(p[2])];
      if (anyHr || anyT) q.push(p[4] == null ? null : Math.round(p[4]), anyT && p[3] != null ? Math.round((p[3] - tStart) / 1000) : null);
      pts.push(q); last = p;
    }
  });
  cleanEle(pts);
  const t0 = raw[0][3], t1 = raw[raw.length - 1][3];
  const nameEl = doc.getElementsByTagName("name")[0], typeEl = doc.getElementsByTagName("type")[0];
  const date = Number.isFinite(t0) ? new Date(t0).toISOString().slice(0, 10) : "";
  const stats = {};
  if (hrs.length) { stats.hrAvg = Math.round(mean(hrs)); stats.hrMax = Math.round(Math.max(...hrs)); stats.hrMin = Math.round(Math.min(...hrs)); }
  if (cads.length) stats.cad = Math.round(mean(cads));
  if (pows.length) stats.power = Math.round(mean(pows));
  if (temps.length) stats.temp = Math.round(mean(temps));
  return {
    name: (nameEl && nameEl.textContent.trim()) || filename.replace(/\.gpx$/i, "").replace(/^.*\//, "").replace(/^route_/, "").replace(/_/g, " "),
    date, dist: Math.round(dist), dur: Number.isFinite(t0) && Number.isFinite(t1) ? Math.round((t1 - t0) / 1000) : 0,
    sport: sportOf(typeEl && typeEl.textContent), pts, stats, t0: Number.isFinite(t0) ? t0 : null
  };
}

/* Apple Health export.xml, read as a stream: it is often hundreds of MB, too big to load whole.
   Collects every heart-rate sample (time, bpm) and every workout with its statistics and route file. */
function appleDate(s) { const m = /^(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d) ([+-]\d\d)(\d\d)$/.exec(s || ""); return m ? Date.parse(`${m[1]}T${m[2]}${m[3]}:${m[4]}`) : Date.parse(s); }
function attrs(line) { const o = {}; line.replace(/(\w+)="([^"]*)"/g, (_, k, v) => { o[k] = v; return ""; }); return o; }
async function readAppleXml(stream, onProgress) {
  let times = new Float64Array(1 << 16), bpm = new Uint16Array(1 << 16), n = 0;
  const found = [];
  let cur = null, rest = "", lines = 0;
  const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
  const handle = line => {
    if (line.indexOf('"HKQuantityTypeIdentifierHeartRate"') !== -1 && line.indexOf("<Record") !== -1) {
      const a = attrs(line), t = appleDate(a.startDate), v = parseFloat(a.value);
      if (!Number.isFinite(t) || !Number.isFinite(v)) return;
      if (n === times.length) { const t2 = new Float64Array(n * 2); t2.set(times); times = t2; const b2 = new Uint16Array(n * 2); b2.set(bpm); bpm = b2; }
      times[n] = t; bpm[n] = Math.round(v); n++;
    } else if (line.indexOf("<Workout ") !== -1) {
      const a = attrs(line);
      cur = { sport: sportOf(a.workoutActivityType), t0: appleDate(a.startDate), t1: appleDate(a.endDate), stats: {}, route: null };
      if (a.totalEnergyBurned) cur.stats.kcal = Math.round(parseFloat(a.totalEnergyBurned));
      if (line.indexOf("/>") !== -1 && line.trim().endsWith("/>")) { found.push(cur); cur = null; }
    } else if (cur && line.indexOf("<WorkoutStatistics") !== -1) {
      const a = attrs(line);
      if (a.type === "HKQuantityTypeIdentifierHeartRate") {
        if (a.average) cur.stats.hrAvg = Math.round(parseFloat(a.average));
        if (a.maximum) cur.stats.hrMax = Math.round(parseFloat(a.maximum));
        if (a.minimum) cur.stats.hrMin = Math.round(parseFloat(a.minimum));
      } else if (a.type === "HKQuantityTypeIdentifierActiveEnergyBurned" && a.sum) cur.stats.kcal = Math.round(parseFloat(a.sum));
      else if ((a.type === "HKQuantityTypeIdentifierRunningPower" || a.type === "HKQuantityTypeIdentifierCyclingPower") && a.average) cur.stats.power = Math.round(parseFloat(a.average));
      else if (a.type === "HKQuantityTypeIdentifierCyclingCadence" && a.average) cur.stats.cad = Math.round(parseFloat(a.average));
    } else if (cur && line.indexOf("<FileReference") !== -1) {
      cur.route = attrs(line).path || null;
    } else if (cur && line.indexOf("</Workout>") !== -1) { found.push(cur); cur = null; }
  };
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    const parts = (rest + value).split("\n");
    rest = parts.pop();
    for (const line of parts) handle(line);
    lines += parts.length;
    if (onProgress && lines > 200000) { lines = 0; onProgress(found.length, n); }
  }
  if (rest) handle(rest);
  // samples are mostly in time order already; sort to be sure, through an index
  const idx = Array.from({ length: n }, (_, i) => i).sort((i, j) => times[i] - times[j]);
  const hr = { t: Float64Array.from(idx, i => times[i]), v: Uint16Array.from(idx, i => bpm[i]) };
  return { workouts: found, hr };
}
function hrAt(series, t) {          // nearest heart-rate sample within a minute
  const T = series.t; if (!T.length) return null;
  let lo = 0, hi = T.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (T[mid] < t) lo = mid + 1; else hi = mid; }
  let best = lo; if (lo > 0 && Math.abs(T[lo - 1] - t) < Math.abs(T[lo] - t)) best = lo - 1;
  return Math.abs(T[best] - t) <= 60000 ? series.v[best] : null;
}

/* Reading a .zip in the browser, entry by entry, without loading the whole file (Apple exports can be several GB).
   Handles zip64 and deflate; inflating uses the browser's own DecompressionStream. */
async function zipEntries(file) {
  const tailLen = Math.min(file.size, 65557 + 20);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let e = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("not a zip");
  let count = tail.getUint16(e + 10, true), cdSize = tail.getUint32(e + 12, true), cdOff = tail.getUint32(e + 16, true);
  if (count === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    const loc = e - 20;
    if (loc >= 0 && tail.getUint32(loc, true) === 0x07064b50) {
      const z64Off = Number(tail.getBigUint64(loc + 8, true));
      const z = new DataView(await file.slice(z64Off, z64Off + 56).arrayBuffer());
      count = Number(z.getBigUint64(32, true)); cdSize = Number(z.getBigUint64(40, true)); cdOff = Number(z.getBigUint64(48, true));
    }
  }
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const dec = new TextDecoder(), out = [];
  for (let p = 0, k = 0; k < count && p + 46 <= cd.byteLength; k++) {
    if (cd.getUint32(p, true) !== 0x02014b50) break;
    const method = cd.getUint16(p + 10, true), nameLen = cd.getUint16(p + 28, true), extraLen = cd.getUint16(p + 30, true), commLen = cd.getUint16(p + 32, true);
    let comp = cd.getUint32(p + 20, true), size = cd.getUint32(p + 24, true), off = cd.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nameLen));
    for (let x = p + 46 + nameLen; x < p + 46 + nameLen + extraLen;) {      // zip64 sizes and offset
      const id = cd.getUint16(x, true), len = cd.getUint16(x + 2, true);
      if (id === 1) { let y = x + 4; if (size === 0xffffffff) { size = Number(cd.getBigUint64(y, true)); y += 8; } if (comp === 0xffffffff) { comp = Number(cd.getBigUint64(y, true)); y += 8; } if (off === 0xffffffff) off = Number(cd.getBigUint64(y, true)); }
      x += 4 + len;
    }
    out.push({ name, method, comp, size, off });
    p += 46 + nameLen + extraLen + commLen;
  }
  return out;
}
async function zipStream(file, entry) {
  const h = new DataView(await file.slice(entry.off, entry.off + 30).arrayBuffer());
  const start = entry.off + 30 + h.getUint16(26, true) + h.getUint16(28, true);
  const raw = file.slice(start, start + entry.comp).stream();
  if (entry.method === 0) return raw;
  if (entry.method === 8) return raw.pipeThrough(new DecompressionStream("deflate-raw"));
  throw new Error("unsupported compression");
}
const streamText = stream => new Response(stream).text();

// Everything the import button accepts: .gpx files, Apple's export.zip, or export.xml with its GPX files
async function importFiles(files) {
  const found = [], notes = { bad: 0, apple: 0, appleHr: 0, noRoute: 0 };
  const status = (pt, en) => setStatus(T(pt, en));
  let apple = null;
  const gpxSources = [];                 // { name, text() }
  for (const f of files) {
    const lower = f.name.toLowerCase();
    if (lower.endsWith(".zip")) {
      status("A abrir o zip…", "Opening the zip…");
      let entries;
      try { entries = await zipEntries(f); } catch { notes.bad++; continue; }
      const xml = entries.find(x => /(^|\/)(export|exportar)\.xml$/i.test(x.name)) ||
        entries.filter(x => /\.xml$/i.test(x.name) && !/cda/i.test(x.name)).sort((a, b) => b.size - a.size)[0];
      if (xml) {
        status("A ler os dados de saúde (pode demorar um minuto)…", "Reading the health data (this can take a minute)…");
        apple = await readAppleXml(await zipStream(f, xml), (w, h) => status(`A ler os dados de saúde… ${w} treinos, ${h} medições de pulsação`, `Reading the health data… ${w} workouts, ${h} heart-rate readings`));
      }
      for (const x of entries) if (/\.gpx$/i.test(x.name)) gpxSources.push({ name: x.name, text: async () => streamText(await zipStream(f, x)) });
    } else if (lower.endsWith(".xml")) {
      status("A ler os dados de saúde (pode demorar um minuto)…", "Reading the health data (this can take a minute)…");
      apple = await readAppleXml(f.stream(), (w, h) => status(`A ler os dados de saúde… ${w} treinos, ${h} medições de pulsação`, `Reading the health data… ${w} workouts, ${h} heart-rate readings`));
    } else if (lower.endsWith(".gpx")) gpxSources.push({ name: f.name, text: () => f.text() });
    else notes.bad++;
  }
  // Apple: each workout names its route file; match by file name
  const byRoute = new Map();
  if (apple) for (const w of apple.workouts) { if (w.route) byRoute.set(w.route.split("/").pop(), w); else notes.noRoute++; }
  for (let k = 0; k < gpxSources.length; k++) {
    if (k % 10 === 0) status(`A importar ${k + 1} de ${gpxSources.length}…`, `Importing ${k + 1} of ${gpxSources.length}…`);
    const src = gpxSources[k];
    let w = null;
    try { w = parseGpx(await src.text(), src.name, apple && apple.hr.t.length ? apple.hr : null); } catch { w = null; }
    if (!w) { notes.bad++; continue; }
    // the workout this route belongs to: by its file name, or else by time (the route starts during the workout)
    const aw = byRoute.get(src.name.split("/").pop()) ||
      (apple && w.t0 && apple.workouts.find(x => x.t0 - 120000 <= w.t0 && w.t0 <= x.t1));
    if (aw) {
      notes.apple++;
      Object.assign(w.stats, aw.stats);                // Apple's own averages win over ours
      if (aw.sport) w.sport = aw.sport;
      if (Number.isFinite(aw.t0) && Number.isFinite(aw.t1)) w.dur = Math.round((aw.t1 - aw.t0) / 1000);
      if (w.stats.hrAvg) notes.appleHr++;
    }
    found.push(w);
  }
  if (apple) { notes.appleWorkouts = apple.workouts.length; notes.appleRoutes = apple.workouts.filter(x => x.route).length; notes.hrSamples = apple.hr.t.length; }
  return { found, notes, appleRead: !!apple };
}

function buildVisited() {
  if (!workouts.length) { visitedGrid = null; return; }
  const g = new Set();
  const mark = (lat, lon) => g.add(`${Math.floor(lat / VCELL)},${Math.floor(lon / VCELL)}`);
  for (const w of workouts) for (let i = 0; i < w.pts.length; i++) {
    const p = w.pts[i]; mark(p[0], p[1]);
    const q = w.pts[i + 1]; if (!q) continue;
    const d = haversine(p, q);
    if (d > 2000) continue;                              // a GPS jump, not a path
    for (let k = 1, steps = Math.floor(d / 20); k < steps; k++) mark(p[0] + (q[0] - p[0]) * k / steps, p[1] + (q[1] - p[1]) * k / steps);
  }
  visitedGrid = g;
}
function nearVisited(lat, lon) {
  const ci = Math.floor(lat / VCELL), cj = Math.floor(lon / VCELL);
  for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) if (visitedGrid.has(`${ci + di},${cj + dj}`)) return true;
  return false;
}

function drawWorkouts() {
  workoutLayer.clearLayers();
  if (!$("wk-show").checked) return;
  const color = lineColors().past;
  for (const w of workouts) L.polyline(w.pts.map(p => [p[0], p[1]]), { color, weight: 3, opacity: .5, interactive: false }).addTo(workoutLayer);
}

function renderWorkouts() {
  const total = workouts.reduce((a, w) => a + w.dist, 0);
  $("wk-count").textContent = workouts.length ? `· ${workouts.length} · ${Math.round(total / 1000)} km` : "";
  $("wk-box").hidden = !workouts.length;
  $("fresh-row").hidden = !workouts.length;
  if (!workouts.length) $("wk-fresh").checked = false;
  const list = $("wk-list"); list.innerHTML = "";
  workouts.map((w, i) => ({ w, i })).sort((a, b) => (b.w.date || "").localeCompare(a.w.date || "")).slice(0, 8).forEach(({ w, i }) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "wk-item";
    b.innerHTML = "<b></b><span></span>";
    b.firstChild.textContent = [w.date, w.sport && SPORTS[w.sport] ? TT(SPORTS[w.sport]) : w.name].filter(Boolean).join(" · ");
    b.lastChild.textContent = `${fmtKm(w.dist)} km${w.dur ? " · " + fmtTime(w.dur) : ""}${w.stats && w.stats.hrAvg ? ` · ♥ ${w.stats.hrAvg}` : ""}`;
    b.addEventListener("click", () => openWorkout(i));
    list.appendChild(b);
  });
  $("hr-max").placeholder = String(maxHr());
  renderPlanSummary();
  drawWorkouts();
}

// Open a workout as a ticket in O meu mapa, to look at: nothing moves when you tap the map.
// "Editar" takes it to Desenhar as a route you can reshape; "Um novo parecido" plans a fresh loop like it.
function openWorkout(i) {
  const w = workouts[i]; if (!w) return;
  if (view !== "mine") setView("mine");
  resetRoutes();
  map.removeLayer(heatLayer); routeLayer.addTo(map);
  const first = w.pts[0], lastP = w.pts[w.pts.length - 1];
  const act = { walk: "walk", run: "walk", hike: "hike", bike: "bike" }[w.sport] || val("activity");
  const o = Object.assign(readOptions(), { profile: PROFILES[act], start: [first[0], first[1]], manual: true, loop: haversine(first, lastP) < 200, fresh: false, noForest: false, shade: false, fireLevel: null });
  o.sidewalks = o.profile.startsWith("foot");
  const feature = { geometry: { coordinates: w.pts.map(p => [p[1], p[0], p[2] ?? 0]) }, properties: { summary: { distance: w.dist, duration: w.dur } } };
  const keep = visitedGrid; visitedGrid = null;          // a workout is never "new to you"
  const m = analyse(feature, o, editCtx && editCtx.scenery, null);
  visitedGrid = keep;
  if (w.pts.some(p => p[3] != null)) m.hr = w.pts.map(p => p[3] ?? null);   // heart rate along the route
  m.spd = speedAlong(m, w.pts);
  o.length = m.distance;
  candidates = [{ o, m, s: score(m, o), wps: [], points: null, history: [], manual: true, workout: w }];
  selected = 0; routesOf = "mine"; wkOpen = w;
  select(0, true);
  setStatus("");
}
function closeWorkout() {
  if (!wkOpen) return;
  wkOpen = null; resetRoutes();
  map.removeLayer(routeLayer); heatLayer.addTo(map);
  layout(); drawMyMap(false);
}
$("wk-back").addEventListener("click", closeWorkout);
$("wk-edit").addEventListener("click", () => {
  const c = candidates[selected]; if (!c || !c.workout) return;
  const act = ACTIVITY_OF[c.o.profile]; if (act) $("act-" + act).checked = true;
  (c.o.loop ? $("loop-yes") : $("loop-no")).checked = true;
  wkOpen = null; manual = c; routesOf = "draw";
  setView("draw");
  setStart(L.latLng(c.o.start[0], c.o.start[1]), false, c.workout.name);
  select(0, false);
  setStatus(T("Arrasta um ponto ou a linha para fazer dele um percurso novo.", "Drag a point or the line to turn it into a new route."));
});
// a fresh loop like this workout: same start, activity, distance and kind of terrain, on paths you haven't done
$("wk-similar").addEventListener("click", () => {
  const c = candidates[selected]; if (!c || !c.workout) return;
  const act = ACTIVITY_OF[c.o.profile] || "walk";
  $("act-" + act).checked = true;
  $("dist").value = Math.max(2, Math.min(60, Math.round(c.m.distance / 1000)));
  const perKm = c.m.ascent / (c.m.distance / 1000);
  $(perKm < 10 ? "ter-flat" : perKm <= 25 ? "ter-some" : "ter-hilly").checked = true;
  if (!$("fresh-row").hidden) $("wk-fresh").checked = true;
  const s0 = c.o.start;
  wkOpen = null;
  setView("gen");
  setStart(L.latLng(s0[0], s0[1]), true, T("Partida do treino", "Workout start"));
  syncActivity(); syncTerrain();
  generate();
});

/* ---------- O meu mapa: everywhere you've been ---------- */
const heatLayer = L.layerGroup();
const heatRenderer = L.canvas({ padding: 0.5 });
let mmYear = "all";

function mmFiltered() { return workouts.map((w, i) => ({ w, i })).filter(x => mmYear === "all" || (x.w.date || "").startsWith(mmYear)); }

// distance on paths you hadn't covered before: walk every track in 20 m steps, count steps that land in a new 40 m cell
function uniqueKm(list) {
  // a step counts when its cell wasn't covered by any EARLIER workout
  const seen = new Set(); let m = 0;
  for (const { w } of list) {
    const fresh = new Set();
    for (let i = 1; i < w.pts.length; i++) {
      const p = w.pts[i - 1], q = w.pts[i], d = haversine(p, q);
      if (d > 2000) continue;
      const steps = Math.max(1, Math.round(d / 20));
      for (let k = 1; k <= steps; k++) {
        const la = p[0] + (q[0] - p[0]) * k / steps, lo = p[1] + (q[1] - p[1]) * k / steps;
        const key = `${Math.floor(la / VCELL)},${Math.floor(lo / VCELL)}`;
        if (!seen.has(key)) { fresh.add(key); m += d / steps; }
      }
    }
    fresh.forEach(k => seen.add(k));
  }
  return m;
}

function drawMyMap(fit) {
  heatLayer.clearLayers();
  const empty = !workouts.length;
  $("mm-empty").hidden = !empty; $("mm-full").hidden = empty;
  const list = mmFiltered(), color = lineColors().past, style = val("mm-style");
  if (style === "starts") {
    for (const { w, i } of list) L.circleMarker([w.pts[0][0], w.pts[0][1]], { renderer: heatRenderer, radius: 6, color, weight: 2, fillColor: color, fillOpacity: .35 })
      .bindTooltip(`${w.date} · ${fmtKm(w.dist)} km`).on("click", () => openWorkout(i)).addTo(heatLayer);
  } else {
    const heat = style === "heat";
    for (const { w, i } of list) {
      const line = w.pts.map(p => [p[0], p[1]]);
      if (heat) L.polyline(line, { renderer: heatRenderer, color, weight: 9, opacity: .07, interactive: false }).addTo(heatLayer);
      L.polyline(line, { renderer: heatRenderer, color, weight: heat ? 2.5 : 3, opacity: heat ? .32 : .75 })
        .bindTooltip(`${w.date} · ${fmtKm(w.dist)} km`, { sticky: true }).on("click", () => openWorkout(i)).addTo(heatLayer);
    }
  }
  // the numbers for the chosen period
  const total = list.reduce((a, x) => a + x.w.dist, 0), time = list.reduce((a, x) => a + (x.w.dur || 0), 0);
  const dates = list.map(x => x.w.date).filter(Boolean).sort();
  const cell = (l, v, u) => `<div class="stat"><dt>${l}</dt><dd>${v}<small>${u}</small></dd></div>`;
  $("mm-unique").classList.toggle("empty", empty);
  $("mm-unique").innerHTML = `${Math.round(uniqueKm(list) / 1000)}<small>km</small>`;
  const kcal = list.reduce((a, x) => a + ((x.w.stats && x.w.stats.kcal) || 0), 0);
  $("mm-stats").innerHTML =
    cell(T("Treinos", "Workouts"), list.length, "") +
    cell(T("Total", "Total"), Math.round(total / 1000), "km") +
    cell(T("Tempo", "Time"), Math.round(time / 3600), "h") +
    (kcal ? cell(T("Calorias", "Calories"), kcal >= 10000 ? (kcal / 1000).toFixed(1) + "k" : Math.round(kcal), "kcal") : "") +
    cell(T("Desde", "Since"), dates[0] ? dates[0].slice(0, 7) : "–", "");
  drawMonths(list); renderZones(list); renderRecords(list);
  if (fit && list.length) map.fitBounds(L.latLngBounds(list.flatMap(x => x.w.pts.filter((_, k) => k % 20 === 0).map(p => [p[0], p[1]]))).pad(0.05), fitOpts());
}

const MONTHS = { pt: ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"], en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"] };
const MONTHS_LONG = { pt: ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"], en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"] };
// Kilometres per month: one series, so one colour and no legend; hover or tap a bar to read it.
function drawMonths(list) {
  const svg = $("mm-months");
  let months = [];
  if (mmYear !== "all") for (let k = 0; k < 12; k++) months.push(`${mmYear}-${String(k + 1).padStart(2, "0")}`);
  else { const d = new Date(); for (let k = 11; k >= 0; k--) { const x = new Date(d.getFullYear(), d.getMonth() - k, 1); months.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`); } }
  const km = months.map(mo => list.filter(x => (x.w.date || "").startsWith(mo)).reduce((a, x) => a + x.w.dist, 0) / 1000);
  const n = months.map(mo => list.filter(x => (x.w.date || "").startsWith(mo)).length);
  $("mm-months-title").textContent = mmYear !== "all" ? T(`Quilómetros por mês em ${mmYear}`, `Kilometres per month in ${mmYear}`) : T("Quilómetros por mês, últimos 12 meses", "Kilometres per month, last 12 months");
  const W = svg.clientWidth || 350, H = svg.clientHeight || 96, padT = 14, padB = 16, gap = 4;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const max = Math.max(1, ...km), bw = (W - gap * 11) / 12, h = v => v / max * (H - padT - padB);
  const color = lineColors().past, base = H - padB;
  let g = `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="${css("--line")}" stroke-width="1"/>` +
    `<text x="0" y="9">${Math.round(max)} km</text><line x1="0" x2="${W}" y1="${padT}" y2="${padT}" stroke="${css("--line")}" stroke-width="1" stroke-dasharray="2 3"/>`;
  months.forEach((mo, k) => {
    const x = k * (bw + gap), bh = h(km[k]), r = Math.min(4, bw / 2, bh);
    if (bh > 0) g += `<path data-k="${k}" class="mbar" d="M${x},${base}V${base - bh + r}Q${x},${base - bh} ${x + r},${base - bh}H${x + bw - r}Q${x + bw},${base - bh} ${x + bw},${base - bh + r}V${base}Z" fill="${color}"/>`;
    g += `<text x="${x + bw / 2}" y="${H - 3}" text-anchor="middle">${MONTHS[lang][+mo.slice(5) - 1]}</text>`;
  });
  svg.innerHTML = g + `<rect id="mm-hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
  const read = $("mm-months-read");
  const idle = () => { read.textContent = T("Toca numa barra para ver o mês.", "Hover or tap a bar to read the month."); svg.querySelectorAll(".mbar").forEach(b => b.setAttribute("opacity", "1")); };
  idle();
  const at = clientX => {
    const r = svg.getBoundingClientRect(), k = Math.max(0, Math.min(11, Math.floor((clientX - r.left) * (W / r.width) / (bw + gap))));
    svg.querySelectorAll(".mbar").forEach(b => b.setAttribute("opacity", +b.dataset.k === k ? "1" : ".45"));
    const mo = months[k];
    read.textContent = `${MONTHS_LONG[lang][+mo.slice(5) - 1]} ${mo.slice(0, 4)}: ${km[k].toFixed(km[k] < 10 ? 1 : 0)} km · ${n[k]} ${T(n[k] === 1 ? "treino" : "treinos", n[k] === 1 ? "workout" : "workouts")}`;
  };
  svg.onpointermove = ev => at(ev.clientX); svg.onpointerdown = ev => at(ev.clientX); svg.onpointerleave = idle;
  svg.setAttribute("aria-label", months.map((mo, k) => `${MONTHS_LONG[lang][+mo.slice(5) - 1]} ${km[k].toFixed(0)} km`).join(", "));
}

// Time in each heart-rate zone, from the per-point heart rate and time stamps
function renderZones(list) {
  const mx = maxHr(), secs = [0, 0, 0, 0, 0];
  for (const { w } of list) for (let i = 1; i < w.pts.length; i++) {
    const p = w.pts[i], q = w.pts[i - 1];
    if (p[3] == null || p[4] == null || q[4] == null) continue;
    const dt = p[4] - q[4];
    if (dt > 0 && dt <= 60) secs[zoneOf(p[3], mx)] += dt;      // longer gaps are pauses
  }
  const total = secs.reduce((a, b) => a + b, 0);
  $("mm-zones-box").hidden = !total;
  if (!total) return;
  const b = [.6, .7, .8, .9].map(f => Math.round(f * mx));
  const labels = [`Z1 <${b[0]}`, `Z2 ${b[0]}–${b[1]}`, `Z3 ${b[1]}–${b[2]}`, `Z4 ${b[2]}–${b[3]}`, `Z5 ≥${b[3]}`];
  const names = [T("muito leve", "very easy"), T("leve", "easy"), T("moderado", "moderate"), T("intenso", "hard"), T("máximo", "maximum")];
  const hm = t => { const h = Math.floor(t / 3600), m = Math.round(t % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, "0")}` : `${m} min`; };
  $("mm-zones").innerHTML =
    `<div class="zone-bar" role="img" aria-label="${labels.map((l, k) => `${l}: ${hm(secs[k])}`).join(", ")}">` +
    secs.map((t, k) => t ? `<span style="flex:${t};background:${RAMPS.hr[k]}" title="${labels[k]} bpm · ${hm(t)}"></span>` : "").join("") + `</div>` +
    `<div class="zone-rows">` + secs.map((t, k) => `<span><i style="background:${RAMPS.hr[k]}"></i>${labels[k]} bpm</span><span class="hint">${names[k]}</span><span class="t">${hm(t)} · ${Math.round(t / total * 100)}%</span>`).join("") + `</div>` +
    `<p class="hint" style="margin-top:6px">${T(`Zonas pela pulsação máxima de ${mx}. Podes mudá-la nas definições.`, `Zones from a max heart rate of ${mx}. You can change it in settings.`)}</p>`;
}

// Longest, fastest and most climb for each sport; each one opens its workout
function climbOf(w) { let c = 0; for (let i = 1; i < w.pts.length; i++) { const d = (w.pts[i][2] ?? 0) - (w.pts[i - 1][2] ?? 0); if (d > 0) c += d; } return c; }
function renderRecords(list) {
  const box = $("mm-records"); box.innerHTML = "";
  const bySport = {};
  for (const x of list) (bySport[x.w.sport || "other"] = bySport[x.w.sport || "other"] || []).push(x);
  const sports = Object.keys(bySport).sort((a, b) => bySport[b].length - bySport[a].length);
  $("mm-records-box").hidden = !list.length;
  for (const sp of sports) {
    const ws = bySport[sp], bike = sp === "bike";
    const longest = ws.reduce((a, x) => x.w.dist > a.w.dist ? x : a);
    const timed = ws.filter(x => x.w.dur > 0 && x.w.dist >= 3000);
    const fastest = timed.length ? timed.reduce((a, x) => x.w.dist / x.w.dur > a.w.dist / a.w.dur ? x : a) : null;
    const climbs = ws.map(x => ({ x, c: climbOf(x.w) })), top = climbs.reduce((a, y) => y.c > a.c ? y : a);
    const rows = [
      [T("Mais longo", "Longest"), `${fmtKm(longest.w.dist)} km`, longest],
      fastest && [T("Mais rápido", "Fastest"), bike ? `${(fastest.w.dist / fastest.w.dur * 3.6).toFixed(1)} km/h` : `${fmtPace(fastest.w.dur / (fastest.w.dist / 1000))} /km`, fastest],
      top.c > 0 && [T("Mais subida", "Most climb"), `${Math.round(top.c)} m`, top.x]
    ].filter(Boolean);
    const h = document.createElement("div"); h.className = "rec-sport";
    h.textContent = `${TT(SPORTS[sp] || SPORTS.other)} · ${ws.length}`;
    const ul = document.createElement("div"); ul.className = "rec-list";
    for (const [label, value, x] of rows) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "rec";
      b.innerHTML = "<span></span><b></b>";
      b.firstChild.textContent = `${label} · ${x.w.date || ""}`; b.lastChild.textContent = value;
      b.addEventListener("click", () => openWorkout(x.i));
      ul.appendChild(b);
    }
    box.append(h, ul);
  }
}

function renderYears() {
  const years = [...new Set(workouts.map(w => (w.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  if (mmYear !== "all" && !years.includes(mmYear)) mmYear = "all";
  const box = $("mm-years"); box.innerHTML = "";
  box.hidden = years.length < 2;
  ["all", ...years].forEach(y => {
    const id = "mm-y-" + y;
    box.insertAdjacentHTML("beforeend", `<input type="radio" name="mm-year" id="${id}" value="${y}"${y === mmYear ? " checked" : ""}><label for="${id}">${y === "all" ? T("Sempre", "All time") : y}</label>`);
  });
  box.querySelectorAll("input").forEach(i => i.addEventListener("change", () => { mmYear = i.value; drawMyMap(true); }));
}
document.querySelectorAll("input[name=mm-style]").forEach(i => i.addEventListener("change", () => drawMyMap(false)));

$("wk-import").addEventListener("click", () => $("wk-file").click());
$("wk-file").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length) return;
  $("wk-import").disabled = true;
  let res;
  try { res = await importFiles(files); }
  catch (err) { $("wk-import").disabled = false; return setStatus(T("Não foi possível ler esse ficheiro.", "Couldn't read that file.") + (err && err.message ? ` (${err.message})` : ""), true); }
  let added = 0, upgraded = 0, skipped = 0;
  for (const w of res.found) {
    const i = workouts.findIndex(x => x.date === w.date && Math.abs(x.dist - w.dist) < 50);   // already imported?
    if (i < 0) { workouts.push(w); added++; continue; }
    const old = workouts[i], hasT = x => x.pts.some(p => p[4] != null);
    const richer = Object.keys(w.stats || {}).length > Object.keys(old.stats || {}).length || (hasT(w) && !hasT(old));
    if (richer) { workouts[i] = w; upgraded++; } else skipped++;      // e.g. the same route, now with heart rate
  }
  buildVisited(); renderWorkouts();
  const saved = await saveWorkouts();
  $("wk-import").disabled = false;
  const nt = res.notes, parts = [T(`${added} ${added === 1 ? "treino importado" : "treinos importados"}`, `${added} imported`)];
  if (upgraded) parts.push(T(`${upgraded} ${upgraded === 1 ? "atualizado" : "atualizados"} com mais dados`, `${upgraded} updated with more data`));
  if (skipped) parts.push(T(`${skipped} já ${skipped === 1 ? "estava" : "estavam"} cá`, `${skipped} already there`));
  if (nt.bad) parts.push(T(`${nt.bad} ${nt.bad === 1 ? "ficheiro" : "ficheiros"} sem trajeto GPS`, `${nt.bad} file${nt.bad === 1 ? "" : "s"} without a GPS track`));
  const withHr = res.found.filter(w => w.stats && w.stats.hrAvg).length;
  let tail = withHr ? T(` ${withHr} com frequência cardíaca.`, ` ${withHr} with heart rate.`) : "";
  if (res.appleRead) tail += T(` (Apple Saúde: ${nt.appleWorkouts} treinos, ${nt.appleRoutes} com trajeto, ${nt.hrSamples.toLocaleString("pt-PT")} medições de pulsação${nt.hrSamples ? "" : " — o ficheiro não tem pulsação"}.)`,
    ` (Apple Health: ${nt.appleWorkouts} workouts, ${nt.appleRoutes} with a route, ${nt.hrSamples.toLocaleString("en")} heart-rate readings${nt.hrSamples ? "" : " — the file has no heart rate"}.)`);
  // Apple GPX files on their own have no heart rate: say where it is
  if (!withHr && !res.appleRead && res.found.length && files.every(f => /\.gpx$/i.test(f.name)) && files.some(f => /^route_/i.test(f.name)))
    tail = T(" Os GPX do Apple Watch só têm o trajeto: para teres pulsação e calorias, importa o ficheiro exportar.zip inteiro.", " Apple Watch GPX files only hold the track: for heart rate and calories, import the whole export.zip.");
  if (!saved) tail += T(" Não há espaço para os guardar neste navegador, por isso desaparecem quando fechares a página.", " There wasn't room to keep them in this browser, so they'll be gone when you close the page.");
  setStatus(parts.join(", ") + "." + tail, !saved);
  if (view === "mine") { renderYears(); drawMyMap(true); }
});
$("wk-clear").addEventListener("click", async () => {
  workouts = []; await saveWorkouts(); buildVisited(); renderWorkouts();
  if (view === "mine") { renderYears(); drawMyMap(false); }
  setStatus(T("Treinos apagados deste navegador.", "Workouts removed from this browser."));
});
$("wk-show").addEventListener("change", drawWorkouts);
loadWorkouts().then(() => { buildVisited(); renderWorkouts(); if (view === "mine") { renderYears(); drawMyMap(true); } });

/* ---------- place search (Photon, OpenStreetMap-based) ---------- */
let placeTimer = null, placeHits = [], placeIdx = -1, placeReq = 0;
function placeLabel(pr) {
  const main = pr.name || [pr.street, pr.housenumber].filter(Boolean).join(" ") || pr.city || "";
  const sub = [pr.name && pr.street ? pr.street : null, pr.city || pr.county, pr.state, pr.country].filter(Boolean).filter(x => x !== main);
  return { main, sub: [...new Set(sub)].join(", ") };
}
function renderPlaces() {
  const ul = $("place-results");
  ul.innerHTML = "";
  placeHits.forEach((f, i) => {
    const { main, sub } = placeLabel(f.properties || {});
    const li = document.createElement("li");
    li.setAttribute("role", "option"); li.id = "place-" + i;
    li.setAttribute("aria-selected", String(i === placeIdx));
    li.innerHTML = `<span></span><small></small>`;
    li.firstChild.textContent = main; li.lastChild.textContent = sub;
    li.addEventListener("mousedown", e => { e.preventDefault(); pickPlace(i); });
    ul.appendChild(li);
  });
  ul.hidden = !placeHits.length;
  $("place").setAttribute("aria-expanded", String(!ul.hidden));
}
function pickPlace(i) {
  const f = placeHits[i]; if (!f) return;
  const [lon, lat] = f.geometry.coordinates;
  const label = placeLabel(f.properties || {}).main;
  $("place").value = label;
  placeHits = []; renderPlaces();
  setStart(L.latLng(lat, lon), true, label);
  map.setView([lat, lon], 15);
}
async function searchPlaces(q) {
  const id = ++placeReq;
  const c = map.getCenter();
  const url = `${ownPhoton || "https://photon.komoot.io"}/api/?q=${encodeURIComponent(q)}&limit=6&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (id !== placeReq) return;            // a newer search already started
    placeHits = data.features || []; placeIdx = -1; renderPlaces();
    if (!placeHits.length) setStatus(T("Nenhum lugar encontrado. Tenta outra grafia, ou toca no mapa.", "No place found. Try another spelling, or tap the map."));
  } catch { if (id === placeReq) setStatus(T("A pesquisa não respondeu. Tenta de novo, ou toca no mapa.", "Place search didn't answer. Try again, or tap the map."), true); }
}
$("place").addEventListener("input", e => {
  clearTimeout(placeTimer);
  const q = e.target.value.trim();
  if (q.length < 3) { placeHits = []; renderPlaces(); return; }
  placeTimer = setTimeout(() => searchPlaces(q), 350);
});
$("place").addEventListener("keydown", e => {
  if (!placeHits.length) return;
  if (e.key === "ArrowDown") { placeIdx = (placeIdx + 1) % placeHits.length; renderPlaces(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { placeIdx = (placeIdx - 1 + placeHits.length) % placeHits.length; renderPlaces(); e.preventDefault(); }
  else if (e.key === "Enter") { pickPlace(placeIdx >= 0 ? placeIdx : 0); e.preventDefault(); }
  else if (e.key === "Escape") { placeHits = []; renderPlaces(); }
});
$("place").addEventListener("blur", () => setTimeout(() => { placeHits = []; renderPlaces(); }, 150));

/* ---------- share links: the route lives in the address after # ---------- */
let pendingShare = null;
const ACTIVITY_OF = Object.fromEntries(Object.entries(PROFILES).map(([k, v]) => [v, k]));
function shareUrl(c) {
  const f = n => n.toFixed(5);
  const pts = editPoints(c).map(p => `${f(p.lat)},${f(p.lon)}`).join(";");
  const q = new URLSearchParams({
    a: ACTIVITY_OF[c.o.profile] || "walk",
    s: `${f(c.o.start[0])},${f(c.o.start[1])}`,
    w: pts, l: c.o.loop === false ? "0" : "1",
    q: c.o.quiet ? "1" : "0", sc: c.o.scenic ? "1" : "0", n: c.o.night ? "1" : "0"
  });
  return location.href.split("#")[0] + "#" + q.toString();
}
$("share").addEventListener("click", async () => {
  const c = candidates[selected]; if (!c || !c.m) return;
  const url = shareUrl(c);
  try { history.replaceState(null, "", url); } catch {}
  try {
    await navigator.clipboard.writeText(url);
    setStatus(T("Link copiado. Quem o abrir vê este percurso.", "Link copied. Anyone who opens it sees this route."));
  } catch {
    $("notice").innerHTML = `<div class="notice">${T("Copia este link:", "Copy this link:")}<div class="share-box"><input id="share-url" readonly aria-label="${T("Link para partilhar", "Share link")}"></div></div>`;
    $("share-url").value = url; $("share-url").select();
  }
  if (location.protocol === "file:") $("notice").insertAdjacentHTML("beforeend", `<div class="notice warn">${T("Este link só abre neste computador até o Pisagem ter o seu próprio endereço.", "This link only opens on this computer until Pisagem has its own web address.")}</div>`);
});

function parseShare(hash) {
  const q = new URLSearchParams(hash.replace(/^#/, ""));
  const num = t => t.split(",").map(Number);
  if (!q.get("s") || !q.get("w")) return null;
  const s0 = num(q.get("s")), pts = q.get("w").split(";").map(num).filter(p => p.length === 2 && p.every(Number.isFinite));
  if (s0.length !== 2 || !s0.every(Number.isFinite) || !pts.length) return null;
  return { a: PROFILES[q.get("a")] ? q.get("a") : "walk", s: s0, pts, loop: q.get("l") !== "0", quiet: q.get("q") === "1", scenic: q.get("sc") !== "0", night: q.get("n") === "1" };
}
async function loadShared(sh) {
  pendingShare = null;
  $("act-" + sh.a).checked = true;
  $("quiet").checked = sh.quiet; $("scenic").checked = sh.scenic; $("night").checked = sh.night;
  (sh.loop ? $("loop-yes") : $("loop-no")).checked = true;
  setView("draw"); resetRoutes();
  setStart(L.latLng(sh.s[0], sh.s[1]), true, T("Partida partilhada", "Shared start"));
  if (!hasRouting()) { pendingShare = sh; return openSettings(T("Cola a tua chave de rotas para abrir este percurso partilhado.", "Add your routing key to open this shared route.")); }
  const c = manualCandidate();
  await reroute(c, sh.pts.map(p => ({ lat: p[0], lon: p[1] })));
  if (c.m) { select(0, true); setStatus(T("Percurso partilhado aberto. Arrasta um ponto para o mudar.", "Shared route opened. Drag any point to change it.")); }
}

/* ---------- day / night ---------- */
const darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function themeMode() { return document.querySelector("input[name=theme]:checked").value; }
function applyTheme() {
  const mode = themeMode(), root = document.documentElement;
  if (mode === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", mode);
  const night = mode === "dark" || (mode === "auto" && !!(darkQuery && darkQuery.matches));
  fillKeyedBases(night);
  $("map").classList.toggle("dim-tiles", night && activeBase !== "map" && activeBase !== "sat");
  // lines and the chart take their colours from the theme, so redraw them
  if (lastOfficial && officialLayer.getLayers().length) drawOfficial(lastOfficial);
  if (workouts.length) drawWorkouts();
  if (view === "mine") drawMyMap(false);
  if (selected >= 0) select(selected, false);
}
const savedTheme = store.get("theme");
if (savedTheme && $("theme-" + savedTheme)) $("theme-" + savedTheme).checked = true;
document.querySelectorAll("input[name=theme]").forEach(i => i.addEventListener("change", () => { store.set("theme", themeMode()); applyTheme(); }));
if (darkQuery) (darkQuery.addEventListener ? darkQuery.addEventListener("change", applyTheme) : darkQuery.addListener(applyTheme));
applyTheme();
themeReady = true;

/* ---------- PT / EN ---------- */
$("lang-btn").addEventListener("click", () => {
  lang = lang === "pt" ? "en" : "pt";
  store.set("lang", lang);
  applyLang();
  syncTerrain(); renderStart(); renderWorkouts(); setStatus("");
  for (const c of candidates) if (c.m) c.s = score(c.m, c.o);   // the shortfall notes are written in the current language
  renderOptions();
  if (hasRoute()) select(selected, false); else layout();
  if (view === "mine") { renderYears(); drawMyMap(false); }
});

renderStart();
layout();
// Served from the Pisagem box (nginx in front of ORS, Overpass and Photon)? Then use them, with nothing to set up.
(async () => {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetchT("/ors/v2/health", {}, 4000), j = await r.json();
    if (j.status !== "ready" && j.status !== "not ready") return;
    const o = location.origin;
    if (!store.get("ors-url")) orsServer = o + "/ors";
    if (!store.get("overpass-url")) ownOverpass = o + "/overpass/interpreter";
    if (!store.get("photon-url")) ownPhoton = o + "/photon";
    if (j.status !== "ready") setStatus(T("O servidor de rotas ainda está a arrancar. Tenta daqui a pouco.", "The routing server is still starting. Try again shortly."), true);
  } catch {}
})();
{ const sh = parseShare(location.hash); if (sh) loadShared(sh); }

/* ---------- GPX export ---------- */
$("gpx").addEventListener("click", () => {
  if (selected < 0) return;
  const c = candidates[selected];
  const name = `Pisagem ${fmtKm(c.m.distance)} km`;
  const trkpts = c.m.pts.map(p => `<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}"><ele>${p[2].toFixed(1)}</ele></trkpt>`).join("\n      ");
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Pisagem" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>${name}</name>
    <trkseg>
      ${trkpts}
    </trkseg>
  </trk>
</gpx>`;
  const url = URL.createObjectURL(new Blob([gpx], { type: "application/gpx+xml" }));
  const a = document.createElement("a");
  a.href = url; a.download = `pisagem-${fmtKm(c.m.distance)}km.gpx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

if (typeof module !== "undefined") module.exports = { haversine, destination, analyse, score, buildScenery, nearScenery, pickWaypoints };
